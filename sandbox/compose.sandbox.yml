services:
  nextcloud:
    # The sandbox is intentionally mutable/demo-oriented: always track the
    # newest upstream Nextcloud image here. The base harness stays pinned for
    # reproducible CI and compatibility testing.
    image: ${NEXTCLOUD_IMAGE:-nextcloud:latest}
    pull_policy: always
    extra_hosts:
      - "${SANDBOX_HOSTNAME:-demo.nextcloud.codemyriad.io}:host-gateway"
    environment:
      NEXTCLOUD_ADMIN_USER: "${NEXTCLOUD_ADMIN_USER:-admin}"
      NEXTCLOUD_ADMIN_PASSWORD: "${NEXTCLOUD_ADMIN_PASSWORD:-admin}"
      NEXTCLOUD_TRUSTED_DOMAINS: "localhost 127.0.0.1 nextcloud host.docker.internal reverse-proxy ${SANDBOX_DOMAIN:-}"
      OVERWRITEHOST: "${SANDBOX_DOMAIN:-127.0.0.1:28080}"
      OVERWRITEPROTOCOL: "${SANDBOX_SCHEME:-http}"
      OVERWRITECLIURL: "${SANDBOX_PUBLIC_URL:-http://127.0.0.1:28080}"
    ports:
      - "${NEXTCLOUD_HOST_PORT:-28080}:80"

  signaling:
    volumes:
      - ../runtime/signaling.conf:/config/server.conf:ro

  janus:
    volumes:
      - ../runtime/janus.jcfg:/usr/local/etc/janus/janus.jcfg:ro

  coturn:
    volumes:
      - ../runtime/turnserver.conf:/etc/coturn/turnserver.conf:ro
