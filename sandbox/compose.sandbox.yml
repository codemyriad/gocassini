services:
  nextcloud:
    # The sandbox mirrors a real deployment: track Nextcloud's *stable* channel
    # (currently NC 33.x), not `latest`. `latest` rides the newest major before
    # it's promoted to stable, which has shipped a broken bundled AppAPI ExApp
    # UI. The base harness stays pinned for reproducible CI/compat testing.
    image: ${NEXTCLOUD_IMAGE:-nextcloud:stable}
    pull_policy: always
    extra_hosts:
      - "${SANDBOX_HOSTNAME:-demo.nextcloud.codemyriad.io}:host-gateway"
    environment:
      NEXTCLOUD_ADMIN_USER: "${NEXTCLOUD_ADMIN_USER:-admin}"
      NEXTCLOUD_ADMIN_PASSWORD: "${NEXTCLOUD_ADMIN_PASSWORD:-admin}"
      NEXTCLOUD_TRUSTED_DOMAINS: "localhost 127.0.0.1 nextcloud host.docker.internal reverse-proxy ${SANDBOX_DOMAIN:-}"
      OVERWRITEHOST: "${SANDBOX_DOMAIN:-127.0.0.1:28080}"
      OVERWRITEPROTOCOL: "${SANDBOX_SCHEME:-http}"
      OVERWRITECLIURL: "${SANDBOX_PUBLIC_URL:-http://127.0.0.1:28080}"
    ports:
      - "${NEXTCLOUD_HOST_PORT:-28080}:80"

  signaling:
    volumes:
      - ../sandbox/runtime/signaling.conf:/config/server.conf:ro

  janus:
    volumes:
      - ../sandbox/runtime/janus.jcfg:/usr/local/etc/janus/janus.jcfg:ro

  coturn:
    volumes:
      - ../sandbox/runtime/turnserver.conf:/etc/coturn/turnserver.conf:ro
