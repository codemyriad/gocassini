; Disable PHP's JIT for the harness's Nextcloud container.
;
; The stock nextcloud:34.x image ships opcache-recommended.ini with
;   opcache.jit=1255
;   opcache.jit_buffer_size=8M
; On PHP 8.5.10 that combination segfaults every Apache prefork worker when the
; set of enabled Nextcloud apps changes while the JIT is warm — installing an
; app over HTTP, then loading a page that exercises the new app set, takes the
; whole instance down (SIGSEGV, not a PHP fatal) until the container restarts.
;
; Measured on nextcloud:34.0.3 / PHP 8.5.10 / Apache prefork, 2026-09-02:
;   jit on,  install + warm traffic + install + page load  -> 2/2 runs crashed
;   jit off, identical recipe                              -> 0/2 runs crashed
;
; The JIT buffer lives in the shared opcache segment, which is why every child
; dies at once, why freshly forked children die too, and why only a process
; restart clears it. The CLI SAPI is unaffected (opcache.enable_cli=Off), which
; is why `occ` keeps working through the outage.
;
; PHP's JIT does close to nothing for Nextcloud's I/O-bound request profile, so
; turning it off costs the harness nothing measurable.
opcache.jit=disable
opcache.jit_buffer_size=0
