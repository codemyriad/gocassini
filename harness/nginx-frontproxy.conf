# Front reverse proxy for the local App Store dogfood testbed.
#
# Mirrors the production topology HaRP expects: an external reverse proxy
# routes /exapps/<appId>/... to HaRP and everything else to Nextcloud.
# Without this layer AppAPI's heartbeat URL "http://reverse-proxy/exapps/
# <appId>/heartbeat" cannot reach HaRP and the install hangs in retry.

server {
    listen 80 default_server;
    # Signaling shares this namespace and calls the browser's localhost URL.
    # The official nginx entrypoint substitutes only this environment variable.
    listen 127.0.0.1:${NEXTCLOUD_LOOPBACK_PORT};
    server_name _;

    # Refresh upstream addresses when Compose recreates Nextcloud or HaRP.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location = /.cassini-listener {
        access_log off;
        return 204;
    }

    client_max_body_size 1024M;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_read_timeout 300s;

    # ExApp traffic — proxy controller URLs (/index.php/apps/app_api/proxy/...
    # served by Nextcloud itself) AND the AppAPI heartbeat/init endpoints
    # mounted under /exapps/<appId>/... (served by HaRP, which then forwards
    # to the ExApp container over its FRP tunnel).
    location /exapps/ {
        set $harp_backend appapi-harp:8780;
        proxy_pass http://$harp_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Pass through any AppAPI auth headers HaRP needs.
        proxy_pass_request_headers on;
    }

    # Everything else goes to Nextcloud.
    location / {
        set $nextcloud_backend nextcloud:80;
        proxy_pass http://$nextcloud_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
