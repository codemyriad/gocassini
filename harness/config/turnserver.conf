# Local coturn config for the test harness.
listening-port=13479
tls-listening-port=0

# Address the relay is advertised at. The relay socket itself binds the
# container's address (coturn's default); the published 49160-49200/udp
# range carries it to this address.
external-ip=127.0.0.1

min-port=49160
max-port=49200

use-auth-secret
static-auth-secret=3c04d2fc2f7fe39d48eb4dc77f652c8c778a4ea178b0e486529b284afca7b648
realm=localhost

fingerprint
no-cli
no-tls
no-dtls

log-file=stdout
verbose
