x-nextcloud-env: &nextcloud-env
  # DEV-ONLY local harness credentials. These values are committed test
  # defaults and must never be reused for a real Nextcloud deployment.
  POSTGRES_HOST: db
  POSTGRES_DB: nextcloud
  POSTGRES_USER: nc
  POSTGRES_PASSWORD: nc
  NEXTCLOUD_ADMIN_USER: admin
  NEXTCLOUD_ADMIN_PASSWORD: admin
  NEXTCLOUD_TRUSTED_DOMAINS: "localhost 127.0.0.1 nextcloud host.docker.internal reverse-proxy ${CASSINI_HARNESS_HOST:-127.0.0.1} ${CASSINI_HARNESS_PUBLIC_HOST:-}"

services:
  db:
    image: ${COMPAT_DB_IMAGE:-postgres:16-alpine}
    restart: unless-stopped
    environment:
      POSTGRES_DB: nextcloud
      POSTGRES_USER: nc
      POSTGRES_PASSWORD: nc
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nc -d nextcloud"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - db_data:/var/lib/postgresql/data

  nextcloud:
    # CI selects exact, digest-pinned baselines from ci/nextcloud-compatibility.json.
    # The local convenience default is validated against its reference baseline.
    # Use scripts/nextcloud_compatibility.py prepare to reproduce the full lock.
    image: ${NEXTCLOUD_IMAGE:-nextcloud:35.0.0}
    restart: unless-stopped
    environment: *nextcloud-env
    depends_on:
      db:
        condition: service_healthy
    ports:
      # Default 28080 for local/manual use. CI e2e runs that bring up a
      # throwaway PID-scoped project (ci-e2e-talk-record-roundtrip.sh)
      # export a run-scoped port instead so a leaked stack from an older
      # cancelled run can never hold the port hostage (gh issue #51).
      - "${NEXTCLOUD_HOST_PORT:-28080}:80"
    volumes:
      - nextcloud_data:/var/www/html
      # Mounted so AppAPI's "docker-install" daemon can pull images and
      # spawn ExApp containers on the host Docker engine.
      - /var/run/docker.sock:/var/run/docker.sock
      # Turns off the JIT the stock image enables. Without this, enabling a
      # Nextcloud app over HTTP and then loading a page segfaults every Apache
      # worker on PHP 8.5 and the instance stays down until it is restarted.
      # See the file's own comment for the measurement.
      - ./php/zz-harness-no-jit.ini:/usr/local/etc/php/conf.d/zz-harness-no-jit.ini:ro

  # AppAPI routes and the local Nextcloud callback listener share this nginx.
  # Signaling shares its network namespace, so browser-supplied localhost URLs
  # reach the listener without a separate forwarding container.
  reverse-proxy:
    image: ${COMPAT_PROXY_IMAGE:-nginx:alpine}
    restart: unless-stopped
    depends_on:
      - nextcloud
    ports:
      # A shared network namespace publishes ports on its owning service.
      - "28082:28082"
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "${CASSINI_HARNESS_SIGNALING_HOST_ALIAS:-nextcloud-public.invalid}:${CASSINI_HARNESS_MEDIA_HOST:-127.0.0.1}"
    networks:
      default:
        aliases:
          # Keep the service name usable by peers despite the shared namespace.
          - signaling
    environment:
      NEXTCLOUD_LOOPBACK_PORT: "${NEXTCLOUD_HOST_PORT:-28080}"
      NGINX_ENVSUBST_FILTER: "^NEXTCLOUD_LOOPBACK_PORT$"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:$$NEXTCLOUD_LOOPBACK_PORT/.cassini-listener"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 10s
    volumes:
      - ./nginx-frontproxy.conf:/etc/nginx/templates/default.conf.template:ro

  # AppAPI HaRP deploy daemon: the Nextcloud-recommended ExApp orchestrator
  # for NC 32+. Pulls images, spawns containers, and proxies traffic to
  # them via FRP tunnels. HaRP injects HP_FRP_ADDRESS/PORT/SHARED_KEY at
  # deploy; the Cassini entrypoint starts its frpc tunnel when those are
  # present and runs tunnel-less otherwise.
  appapi-harp:
    image: ${COMPAT_HARP_IMAGE:-ghcr.io/nextcloud/nextcloud-appapi-harp:release}
    container_name: appapi-harp
    restart: unless-stopped
    environment:
      HP_SHARED_KEY: "dogfood-shared-key-not-secret"
      NC_INSTANCE_URL: "http://nextcloud"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - appapi_harp_certs:/certs

  nats:
    # Pinned patch release (was nats:2.11-alpine, which resolved to this
    # tag when pinned). Bump alongside the rest of the stack after a green
    # full-profile e2e run.
    image: ${COMPAT_NATS_IMAGE:-nats:2.11.17-alpine}
    profiles: ["full"]
    restart: unless-stopped
    # Signaling connects to nats:4222 over the Compose network.
    command: ["-js"]

  janus:
    # Pinned by digest: this repo publishes no release tags, only mutable
    # :latest / :master / master_<sha> tags, so the digest is the only
    # immutable reference. It is what :latest resolved to when pinned
    # (last pushed 2023; :master is newer but untested here). Bump by
    # resolving the new digest (docker buildx imagetools inspect
    # canyan/janus-gateway:latest) after a green full-profile e2e run.
    image: ${COMPAT_JANUS_IMAGE:-canyan/janus-gateway:latest@sha256:80970d0b1c407222e2f88d7a6d31a16686fb9a5145a491b4b4d843ee40ee4ce1}
    profiles: ["full"]
    restart: unless-stopped
    depends_on:
      - nats
    ports:
      # Match Janus's advertised RTP range; host and container ports must agree.
      # keep_private_host also lets peers on the Compose network connect directly.
      # Janus control ports stay internal.
      - "20000-20100:20000-20100/udp"
    volumes:
      - ${JANUS_CONF:-./config/janus/janus.jcfg}:/usr/local/etc/janus/janus.jcfg:ro
      - ./config/janus/janus.transport.websockets.jcfg:/usr/local/etc/janus/janus.transport.websockets.jcfg:ro
      - ./config/janus/janus.transport.http.jcfg:/usr/local/etc/janus/janus.transport.http.jcfg:ro
      - ./config/janus/janus.plugin.videoroom.jcfg:/usr/local/etc/janus/janus.plugin.videoroom.jcfg:ro

  signaling:
    # Pinned release (was :latest, which resolved to 2.1.1 when pinned).
    # Bump to the newest release tag on
    # https://hub.docker.com/r/strukturag/nextcloud-spreed-signaling after
    # a green full-profile e2e run.
    image: ${COMPAT_SIGNALING_IMAGE:-strukturag/nextcloud-spreed-signaling:2.1.1}
    profiles: ["full"]
    restart: unless-stopped
    network_mode: "service:reverse-proxy"
    depends_on:
      nats:
        condition: service_started
      janus:
        condition: service_started
      reverse-proxy:
        condition: service_healthy
        restart: true
    volumes:
      # The signaling server whitelists Nextcloud backend URLs; the stock
      # config pins port 28080. Runs that re-scope NEXTCLOUD_HOST_PORT
      # render a per-run copy and point SIGNALING_CONF at it.
      - ${SIGNALING_CONF:-./config/signaling.conf}:/config/server.conf:ro
      # Remote callbacks use the existing Docker-network HTTPS helper. Trust
      # its generated certificate while retaining normal backend TLS checks.
      - ${SIGNALING_PUBLIC_PROXY_CERT:-./config/signaling-extra-ca.pem}:/etc/ssl/certs/cassini-harness.crt:ro

  signaling-public-proxy:
    image: ${COMPAT_PROXY_IMAGE:-nginx:alpine}
    profiles: ["remote"]
    restart: unless-stopped
    depends_on:
      - nextcloud
      - signaling
    command:
      - /bin/sh
      - -c
      - |
        set -eu
        gateway="$$(ip route | awk '/default/ {print $$3; exit}')"
        sed "s/__HOST_GATEWAY__/$${gateway}/g" /etc/nginx/signaling-public-proxy.conf.template > /etc/nginx/conf.d/default.conf
        exec nginx -g 'daemon off;'
    volumes:
      - ${SIGNALING_PUBLIC_PROXY_CONF:-./runtime/generated/signaling-public-proxy.conf}:/etc/nginx/signaling-public-proxy.conf.template:ro
      - ${SIGNALING_PUBLIC_PROXY_CERT:-./runtime/generated/signaling-public-proxy.crt}:/etc/nginx/certs/signaling.crt:ro
      - ${SIGNALING_PUBLIC_PROXY_KEY:-./runtime/generated/signaling-public-proxy.key}:/etc/nginx/certs/signaling.key:ro
    networks:
      default:
        aliases:
          # The service name is already resolvable on the default network;
          # add only the public host alias to avoid duplicate-alias validation
          # failures on older Compose versions when remote mode is not active.
          - ${CASSINI_HARNESS_PUBLIC_HOST:-signaling-public-proxy}

  coturn:
    # Pinned patch release (was coturn/coturn:4.6-alpine, which resolved
    # to this tag when pinned).
    image: ${COMPAT_COTURN_IMAGE:-coturn/coturn:4.6.3-alpine}
    profiles: ["full"]
    restart: unless-stopped
    ports:
      # Preserve relay port numbers at the configured external-ip.
      - "13479:13479/udp"
      - "13479:13479/tcp"
      - "49160-49200:49160-49200/udp"
    command: ["-c", "/etc/coturn/turnserver.conf"]
    volumes:
      - ${TURN_CONF:-./config/turnserver.conf}:/etc/coturn/turnserver.conf:ro

volumes:
  db_data:
  nextcloud_data:
  appapi_harp_certs:
