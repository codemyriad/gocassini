x-nextcloud-env: &nextcloud-env
  POSTGRES_HOST: db
  POSTGRES_DB: nextcloud
  POSTGRES_USER: nc
  POSTGRES_PASSWORD: nc
  NEXTCLOUD_ADMIN_USER: admin
  NEXTCLOUD_ADMIN_PASSWORD: admin
  NEXTCLOUD_TRUSTED_DOMAINS: "localhost 127.0.0.1 nextcloud host.docker.internal reverse-proxy"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: nextcloud
      POSTGRES_USER: nc
      POSTGRES_PASSWORD: nc
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nc -d nextcloud"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - db_data:/var/lib/postgresql/data

  nextcloud:
    # :latest tracks the current Nextcloud release (33.0.3 today; rolls
    # forward when NC 34 ships). NOT :stable — that alias lags on Docker
    # Hub (still resolves to 32.x as of May 2026 even though NC 33 has
    # been the latest stable since Feb 2026).
    image: nextcloud:latest
    restart: unless-stopped
    environment: *nextcloud-env
    depends_on:
      db:
        condition: service_healthy
    ports:
      # Default 28080 for local/manual use. CI e2e runs that bring up a
      # throwaway PID-scoped project (ci-e2e-talk-record-roundtrip.sh)
      # export a run-scoped port instead so a leaked stack from an older
      # cancelled run can never hold the port hostage (gh issue #51).
      - "${NEXTCLOUD_HOST_PORT:-28080}:80"
    volumes:
      - nextcloud_data:/var/www/html
      # Mounted so AppAPI's "docker-install" daemon can pull images and
      # spawn ExApp containers on the host Docker engine.
      - /var/run/docker.sock:/var/run/docker.sock

  # Internal reverse proxy. Mirrors the production topology HaRP expects:
  # /exapps/<appId>/... goes to HaRP (which forwards over FRP tunnel to
  # the ExApp container), everything else goes to Nextcloud. AppAPI's
  # daemon nextcloud_url points at this service (via Docker DNS), so
  # AppAPI's internal heartbeat probe, the ExApp container's callbacks,
  # and NC's server-side proxy fetches all path-split correctly. No
  # host port mapping — the browser hits Nextcloud directly on 28080;
  # only NC's PHP and the ExApp container resolve "reverse-proxy" via
  # the compose network.
  reverse-proxy:
    image: nginx:alpine
    restart: unless-stopped
    depends_on:
      - nextcloud
    volumes:
      - ./nginx-frontproxy.conf:/etc/nginx/conf.d/default.conf:ro

  # AppAPI HaRP deploy daemon: the Nextcloud-recommended ExApp orchestrator
  # for NC 32+. Pulls images, spawns containers, and proxies traffic to
  # them via FRP tunnels. HaRP injects HP_FRP_ADDRESS/PORT/SHARED_KEY at
  # deploy; the Cassini entrypoint starts its frpc tunnel when those are
  # present and runs tunnel-less otherwise.
  appapi-harp:
    image: ghcr.io/nextcloud/nextcloud-appapi-harp:release
    container_name: appapi-harp
    restart: unless-stopped
    environment:
      HP_SHARED_KEY: "dogfood-shared-key-not-secret"
      NC_INSTANCE_URL: "http://nextcloud"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - appapi_harp_certs:/certs

  nats:
    image: nats:2.11-alpine
    profiles: ["full"]
    restart: unless-stopped
    network_mode: host
    command: ["-js", "-a", "127.0.0.1", "-p", "14222"]

  janus:
    image: canyan/janus-gateway:latest
    profiles: ["full"]
    restart: unless-stopped
    network_mode: host
    depends_on:
      - nats
    volumes:
      - ./config/janus/janus.jcfg:/usr/local/etc/janus/janus.jcfg:ro
      - ./config/janus/janus.transport.websockets.jcfg:/usr/local/etc/janus/janus.transport.websockets.jcfg:ro
      - ./config/janus/janus.transport.http.jcfg:/usr/local/etc/janus/janus.transport.http.jcfg:ro
      - ./config/janus/janus.plugin.videoroom.jcfg:/usr/local/etc/janus/janus.plugin.videoroom.jcfg:ro

  signaling:
    image: strukturag/nextcloud-spreed-signaling:latest
    profiles: ["full"]
    restart: unless-stopped
    network_mode: host
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - nats
      - janus
      - nextcloud
    volumes:
      # The signaling server whitelists Nextcloud backend URLs; the stock
      # config pins port 28080. Runs that re-scope NEXTCLOUD_HOST_PORT
      # render a per-run copy and point SIGNALING_CONF at it.
      - ${SIGNALING_CONF:-./config/signaling.conf}:/config/server.conf:ro

  coturn:
    image: coturn/coturn:4.6-alpine
    profiles: ["full"]
    restart: unless-stopped
    network_mode: host
    command: ["-c", "/etc/coturn/turnserver.conf"]
    volumes:
      - ./config/turnserver.conf:/etc/coturn/turnserver.conf:ro

volumes:
  db_data:
  nextcloud_data:
  appapi_harp_certs:
