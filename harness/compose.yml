x-nextcloud-env: &nextcloud-env
  POSTGRES_HOST: db
  POSTGRES_DB: nextcloud
  POSTGRES_USER: nc
  POSTGRES_PASSWORD: nc
  NEXTCLOUD_ADMIN_USER: admin
  NEXTCLOUD_ADMIN_PASSWORD: admin
  NEXTCLOUD_TRUSTED_DOMAINS: "localhost 127.0.0.1 nextcloud host.docker.internal reverse-proxy"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: nextcloud
      POSTGRES_USER: nc
      POSTGRES_PASSWORD: nc
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nc -d nextcloud"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - db_data:/var/lib/postgresql/data

  nextcloud:
    image: nextcloud:stable
    restart: unless-stopped
    environment: *nextcloud-env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - nextcloud_data:/var/www/html
      # Mounted so AppAPI's "docker-install" daemon can pull images and
      # spawn ExApp containers on the host Docker engine.
      - /var/run/docker.sock:/var/run/docker.sock

  # Front reverse proxy. Mirrors the production topology HaRP expects:
  # /exapps/<appId>/... goes to HaRP (which forwards over FRP tunnel to
  # the ExApp container), everything else goes to Nextcloud. The admin
  # browser, AppAPI's internal heartbeat probe, and the ExApp container's
  # callbacks all use this URL so a single host name resolves correctly
  # for every direction of traffic.
  reverse-proxy:
    image: nginx:alpine
    restart: unless-stopped
    depends_on:
      - nextcloud
      - appapi-harp
    ports:
      - "28080:80"
    volumes:
      - ./nginx-frontproxy.conf:/etc/nginx/conf.d/default.conf:ro

  # Local Docker registry. The Cassini ExApp image is built locally and
  # pushed here so AppAPI's catalog can reference it as if it lived on a
  # real registry, without us needing network egress or a published image.
  registry:
    image: registry:2
    restart: unless-stopped
    ports:
      - "127.0.0.1:5001:5000"

  # AppAPI HaRP deploy daemon: the Nextcloud-recommended ExApp orchestrator
  # for NC 32+. Pulls images, spawns containers, and proxies traffic to
  # them via FRP tunnels. The Cassini ExApp image is HaRP-only — it
  # crashes on startup without HP_FRP_ADDRESS/PORT/SHARED_KEY env vars
  # which HaRP injects.
  appapi-harp:
    image: ghcr.io/nextcloud/nextcloud-appapi-harp:release
    container_name: appapi-harp
    restart: unless-stopped
    environment:
      HP_SHARED_KEY: "dogfood-shared-key-not-secret"
      NC_INSTANCE_URL: "http://nextcloud"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - appapi_harp_certs:/certs

  # Mock Nextcloud App Store catalog server. Serves a hand-crafted
  # appapi_apps.json that mimics https://apps.nextcloud.com/api/v1/ so
  # AppAPI lists Cassini in its External Apps page exactly as it would
  # after a real App Store submission. The admin then clicks the real
  # "Deploy and enable" button. Reachable from the Nextcloud container
  # at http://mockstore/api/v1/appapi_apps.json on the default network.
  mockstore:
    image: nginx:alpine
    restart: unless-stopped
    volumes:
      - ./mockstore/appapi_apps.json:/usr/share/nginx/html/api/v1/appapi_apps.json:ro
      # Release tarballs referenced from the catalog's "download" URL.
      # Populated at setup time so the info.xml inside carries the local
      # registry hostname instead of ghcr.io.
      - ./mockstore/releases:/usr/share/nginx/html/api/v1/releases:ro

  nats:
    image: nats:2.11-alpine
    profiles: ["full"]
    restart: unless-stopped
    network_mode: host
    command: ["-js", "-a", "127.0.0.1", "-p", "14222"]

  janus:
    image: canyan/janus-gateway:latest
    profiles: ["full"]
    restart: unless-stopped
    network_mode: host
    depends_on:
      - nats
    volumes:
      - ./config/janus/janus.jcfg:/usr/local/etc/janus/janus.jcfg:ro
      - ./config/janus/janus.transport.websockets.jcfg:/usr/local/etc/janus/janus.transport.websockets.jcfg:ro
      - ./config/janus/janus.transport.http.jcfg:/usr/local/etc/janus/janus.transport.http.jcfg:ro
      - ./config/janus/janus.plugin.videoroom.jcfg:/usr/local/etc/janus/janus.plugin.videoroom.jcfg:ro

  signaling:
    image: strukturag/nextcloud-spreed-signaling:latest
    profiles: ["full"]
    restart: unless-stopped
    network_mode: host
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - nats
      - janus
      - nextcloud
    volumes:
      - ./config/signaling.conf:/config/server.conf:ro

  coturn:
    image: coturn/coturn:4.6-alpine
    profiles: ["full"]
    restart: unless-stopped
    network_mode: host
    command: ["-c", "/etc/coturn/turnserver.conf"]
    volumes:
      - ./config/turnserver.conf:/etc/coturn/turnserver.conf:ro

volumes:
  db_data:
  nextcloud_data:
  appapi_harp_certs:
