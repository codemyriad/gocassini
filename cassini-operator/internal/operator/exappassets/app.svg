<?xml version="1.0" standalone="no"?>
<!DOCTYPE svg PUBLIC "-//W3C//DTD SVG 1.1//EN" "http://www.w3.org/Graphics/SVG/1.1/DTD/svg11.dtd">
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="gradient-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background circle -->
  <circle cx="64" cy="64" r="60" fill="url(#gradient-bg)" />
  <!-- Saturn/Orbit ring lines -->
  <ellipse cx="64" cy="64" rx="44" ry="16" fill="none" stroke="#ffffff" stroke-width="4" stroke-opacity="0.3" transform="rotate(-15 64 64)" />
  <!-- Stylized Planet (Saturn) -->
  <circle cx="64" cy="64" r="28" fill="#ffffff" fill-opacity="0.9" />
  <!-- Main Orbit/Ring (foreground) -->
  <path d="M 22 75 A 44 16 0 0 0 106 53" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" transform="rotate(-15 64 64)" filter="url(#glow)" />
  <!-- Space Probe / Cassini Icon dots -->
  <circle cx="35" cy="50" r="4" fill="#ffffff" />
  <circle cx="93" cy="78" r="4" fill="#ffffff" />
</svg>
