self-hosted-runner:
  # Custom labels of the self-hosted runners, declared so actionlint can
  # validate runs-on lists instead of flagging them as unknown:
  #   gpu    — the GPU runner (transcribe-smoke-cuda, e2e-talk-record-cuda,
  #            deploy-preview's deploy-gpu)
  #   george — the deploy-preview host
  #
  # Also GitHub-hosted labels newer than the actionlint pinned in lint.yml
  # (v1.7.12, March 2026), which rejects them as unknown. Drop each one when
  # the pin moves to a release that lists it.
  #   ubuntu-26.04, ubuntu-26.04-arm — the hosted runners since #518
  labels:
    - gpu
    - george
    - ubuntu-26.04
    - ubuntu-26.04-arm
