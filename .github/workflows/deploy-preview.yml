name: Deploy Preview

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
  workflow_dispatch:
    inputs:
      run_processing:
        description: Reprocess branch artifacts before publishing the preview
        type: boolean
        default: false

concurrency:
  group: george-deploy
  cancel-in-progress: false

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      branch: ${{ steps.detect.outputs.branch }}
      encoded_branch: ${{ steps.detect.outputs.encoded_branch }}
      should_run: ${{ steps.detect.outputs.should_run }}
      should_process: ${{ steps.detect.outputs.should_process }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: detect
        name: Detect branch mode and relevant changes
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BRANCH="${{ github.head_ref }}"
            BASE_REF="${{ github.event.pull_request.base.ref }}"
          else
            BRANCH="${{ github.ref_name }}"
            BASE_REF="main"
          fi

          git fetch origin "${BASE_REF}:refs/remotes/origin/${BASE_REF}"
          CHANGED="$(git diff "origin/${BASE_REF}...HEAD" --name-only || true)"

          ui_changed=false
          processing_changed=false

          if echo "$CHANGED" | grep -qE '^(cassini-viewer/|\.github/workflows/deploy-preview\.yml$)'; then
            ui_changed=true
          fi

          if echo "$CHANGED" | grep -qE '^(cassini-go-recorder/|ops/process-recordings\.sh$|bin/cassini$|\.github/workflows/deploy-preview\.yml$)'; then
            processing_changed=true
          fi

          run_processing_requested="${{ github.event.inputs.run_processing || 'false' }}"
          should_process=false
          should_run=false

          if [ "$processing_changed" = "true" ] || [ "$run_processing_requested" = "true" ]; then
            should_process=true
            should_run=true
          fi

          if [ "$ui_changed" = "true" ]; then
            should_run=true
          fi

          ENCODED_BRANCH="$(echo "$BRANCH" | sed 's|/|--|g')"

          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "encoded_branch=$ENCODED_BRANCH" >> "$GITHUB_OUTPUT"
          echo "should_run=$should_run" >> "$GITHUB_OUTPUT"
          echo "should_process=$should_process" >> "$GITHUB_OUTPUT"

  deploy:
    needs: detect
    if: needs.detect.outputs.should_run == 'true'
    runs-on: [self-hosted, george]
    env:
      BRANCH: ${{ needs.detect.outputs.branch }}
      ENCODED_BRANCH: ${{ needs.detect.outputs.encoded_branch }}
      SHOULD_PROCESS: ${{ needs.detect.outputs.should_process }}
      PREVIEW_ROOT: /mnt/data/cassini/previews
      RCLONE_CONFIG_CODEMYRIAD_TYPE: s3
      RCLONE_CONFIG_CODEMYRIAD_PROVIDER: Cloudflare
      RCLONE_CONFIG_CODEMYRIAD_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      RCLONE_CONFIG_CODEMYRIAD_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      RCLONE_CONFIG_CODEMYRIAD_ENDPOINT: ${{ secrets.R2_S3_ENDPOINT }}
      RCLONE_CONFIG_CODEMYRIAD_ACL: private
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        if: env.SHOULD_PROCESS == 'true'
        uses: actions/setup-go@v5
        with:
          go-version-file: cassini-go-recorder/go.mod
          cache-dependency-path: cassini-go-recorder/go.sum

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cassini-viewer/package-lock.json

      - name: Prepare branch-scoped paths
        run: |
          echo "BRANCH_PREVIEW_ROOT=${PREVIEW_ROOT}/${ENCODED_BRANCH}" >> "$GITHUB_ENV"
          echo "RAW_DIR=${PREVIEW_ROOT}/${ENCODED_BRANCH}/raw" >> "$GITHUB_ENV"
          echo "PROC_DIR=${PREVIEW_ROOT}/${ENCODED_BRANCH}/processed" >> "$GITHUB_ENV"
          echo "CASSINI_CACHE_ROOT=${PREVIEW_ROOT}/${ENCODED_BRANCH}/.cache" >> "$GITHUB_ENV"
          echo "SOURCE_CACHE=/tmp/cassini-source-${{ github.run_id }}" >> "$GITHUB_ENV"
          echo "SOURCE_RECORDINGS_BASE_URL=https://view.meetings.codemyriad.io/main/" >> "$GITHUB_ENV"
          echo "EXPORT_DIR=/tmp/cassini-export-${{ github.run_id }}" >> "$GITHUB_ENV"
          echo "CASSINI_BUILD_DIR=/tmp/cassini-build-${{ github.run_id }}" >> "$GITHUB_ENV"

      - name: Runner preflight
        run: |
          set -euo pipefail
          for cmd in git rclone ffmpeg ffprobe node npm; do
            command -v "$cmd" >/dev/null || {
              echo "missing required command: $cmd" >&2
              exit 1
            }
          done
          if [ "$SHOULD_PROCESS" = "true" ]; then
            command -v nvidia-smi >/dev/null || {
              echo "missing required command: nvidia-smi" >&2
              exit 1
            }
            nvidia-smi >/dev/null
          fi
          mkdir -p "$RAW_DIR" "$PROC_DIR" "$CASSINI_CACHE_ROOT" "$SOURCE_CACHE"

      - name: Download main artifacts for UI-only preview
        if: env.SHOULD_PROCESS != 'true'
        run: |
          set -euo pipefail
          rclone copy "codemyriad:cassini-processed/main/meetings/" "$SOURCE_CACHE/"

      - name: Download raw recordings
        if: env.SHOULD_PROCESS == 'true'
        run: |
          mkdir -p "$RAW_DIR" "$PROC_DIR"
          rclone copy codemyriad:cassini-raw/daily/ "$RAW_DIR/"

      - name: Build cassini from checked-out commit
        if: env.SHOULD_PROCESS == 'true'
        run: |
          mkdir -p "$CASSINI_BUILD_DIR"
          go -C cassini-go-recorder build \
            -o "$CASSINI_BUILD_DIR/cassini" \
            ./cmd/cassini

      - name: Process recordings with GPU
        if: env.SHOULD_PROCESS == 'true'
        env:
          DEVICE: cuda
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          RECORDINGS_DIR="$RAW_DIR" \
          PROCESSED_DIR="$PROC_DIR" \
          CASSINI_BIN="$CASSINI_BUILD_DIR/cassini" \
          CASSINI_CACHE_ROOT="$CASSINI_CACHE_ROOT" \
          bash ops/process-recordings.sh

      - name: Upload branch meeting artifacts
        if: env.SHOULD_PROCESS == 'true'
        run: |
          rclone copy "${PROC_DIR}/" \
            "codemyriad:cassini-processed/${ENCODED_BRANCH}/meetings/"

      - name: Export branch preview bundle
        working-directory: cassini-viewer
        run: |
          npm ci
          if [ "$SHOULD_PROCESS" = "true" ]; then
            SOURCE_DIR="$PROC_DIR"
            RECORDINGS_BASE_URL="https://view.meetings.codemyriad.io/${ENCODED_BRANCH}/"
          else
            SOURCE_DIR="$SOURCE_CACHE"
            RECORDINGS_BASE_URL="$SOURCE_RECORDINGS_BASE_URL"
          fi
          npm run export:meetings -- \
            --source-dir "$SOURCE_DIR" \
            --output-dir "$EXPORT_DIR" \
            --recordings-base-url "$RECORDINGS_BASE_URL"

      - name: Publish branch preview bundle
        run: |
          rclone copy "${EXPORT_DIR}/" \
            "codemyriad:cassini-processed/${ENCODED_BRANCH}/"
          if [ "$SHOULD_PROCESS" = "true" ]; then
            HASH=$(git rev-parse HEAD:cassini-go-recorder HEAD:ops/process-recordings.sh HEAD:bin/cassini | sha256sum | cut -c1-16)
            echo "$HASH" | rclone rcat "codemyriad:cassini-processed/${ENCODED_BRANCH}/.processing-hash"
          fi

      - name: Cleanup temp files
        if: always()
        run: |
          rm -rf /tmp/cassini-export-${{ github.run_id }}
          rm -rf /tmp/cassini-build-${{ github.run_id }}
          rm -rf /tmp/cassini-source-${{ github.run_id }}
