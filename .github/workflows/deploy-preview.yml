name: Deploy Preview

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

# Serialize all deploy jobs on george — every PR update gets deployed, none are
# cancelled. This prevents concurrent jobs from racing over shared disk paths.
concurrency:
  group: george-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, george]
    env:
      BRANCH: ${{ github.head_ref }}
      PREVIEW_ROOT: /mnt/data/cassini/previews
      # R2 credentials injected from GitHub Secrets — no rclone.conf needed on the runner
      RCLONE_CONFIG_CODEMYRIAD_TYPE: s3
      RCLONE_CONFIG_CODEMYRIAD_PROVIDER: Cloudflare
      RCLONE_CONFIG_CODEMYRIAD_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      RCLONE_CONFIG_CODEMYRIAD_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      RCLONE_CONFIG_CODEMYRIAD_ENDPOINT: ${{ secrets.R2_S3_ENDPOINT }}
      RCLONE_CONFIG_CODEMYRIAD_ACL: private
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cassini-viewer/package-lock.json

      - name: Encode branch name for R2 key prefix
        run: |
          ENCODED=$(echo "$BRANCH" | sed 's|/|--|g')
          echo "ENCODED_BRANCH=$ENCODED" >> $GITHUB_ENV
          echo "BRANCH_PREVIEW_ROOT=${{ env.PREVIEW_ROOT }}/$ENCODED" >> $GITHUB_ENV
          echo "RAW_DIR=${{ env.PREVIEW_ROOT }}/$ENCODED/raw" >> $GITHUB_ENV
          echo "PROC_DIR=${{ env.PREVIEW_ROOT }}/$ENCODED/processed" >> $GITHUB_ENV
          echo "CASSINI_CACHE_ROOT=${{ env.PREVIEW_ROOT }}/$ENCODED/.cache" >> $GITHUB_ENV
          echo "EXPORT_DIR=/tmp/cassini-export-${{ github.run_id }}" >> $GITHUB_ENV
          echo "CASSINI_BUILD_DIR=/tmp/cassini-build-${{ github.run_id }}" >> $GITHUB_ENV

      - name: Runner preflight
        run: |
          set -euo pipefail
          for cmd in git rclone ffmpeg ffprobe node npm; do
            command -v "$cmd" >/dev/null || {
              echo "missing required command: $cmd" >&2
              exit 1
            }
          done
          mkdir -p "$RAW_DIR" "$PROC_DIR" "$CASSINI_CACHE_ROOT"

      - name: Download main meetings from R2
        run: |
          MAIN_CACHE=/tmp/cassini-main-${{ github.run_id }}
          mkdir -p "$MAIN_CACHE"
          rclone copy codemyriad:cassini-processed/main/meetings/ "$MAIN_CACHE/"
          echo "MAIN_RECORDINGS_CACHE=$MAIN_CACHE" >> $GITHUB_ENV

      - name: Build and export viewer
        working-directory: cassini-viewer
        run: |
          npm ci
          npm run export:meetings -- \
            --source-dir "$MAIN_RECORDINGS_CACHE" \
            --output-dir "$EXPORT_DIR" \
            --recordings-base-url https://view.meetings.codemyriad.io/main/

      - name: Upload viewer
        run: |
          rclone copy "${EXPORT_DIR}/" \
            "codemyriad:cassini-processed/${ENCODED_BRANCH}/"

      # ── Cleanup ─────────────────────────────────────────────────────────────
      - name: Cleanup temp files
        if: always()
        run: |
          rm -rf /tmp/cassini-export-${{ github.run_id }}
          rm -rf /tmp/cassini-main-${{ github.run_id }}
