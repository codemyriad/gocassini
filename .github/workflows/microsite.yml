name: Microsite

# Build + lint gate for the Astro microsite, and its deploy: a push to main
# that passes the gate is deployed to the `gocassini` Worker (gocassini.com)
# with the exact `dist` the build job produced.
#
# Deliberately a separate workflow rather than a job in ci.yml: ci.yml's
# `paths-ignore: '**/*.md'` would skip PRs that only touch the microsite's
# markdown content, but that content is schema-validated at build time
# (src/content/config.ts), so a bad frontmatter change breaks the build.
#
# `npm ci` here is what guards the failure this workflow was added for: the
# microsite once shipped with no package.json/lockfile at all, and nothing in
# CI noticed — it was only caught when someone tried to deploy it.

on:
  push:
    branches: [main]
    paths:
      - 'cassini-microsite/**'
      - '.github/workflows/microsite.yml'
  pull_request:
    paths:
      - 'cassini-microsite/**'
      - 'cassini-viewer/**'
      - '.github/workflows/microsite.yml'

permissions:
  contents: read

concurrency:
  group: microsite-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cassini-microsite
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # Single source of truth for the local and CI build Node version.
          node-version-file: cassini-microsite/.nvmrc
          cache: npm
          cache-dependency-path: cassini-microsite/package-lock.json

      - name: Install (fails if manifest/lockfile are missing or out of sync)
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Keep the build for the deploy job
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: microsite-dist
          path: cassini-microsite/dist
          retention-days: 1
          if-no-files-found: error

  # The public embed (D-775) is built from cassini-viewer and COMMITTED under
  # cassini-microsite/public/embed/v1/. Committed build output drifts unless
  # something checks it, so this is that something: it rebuilds the bundle and
  # fails if the committed pair is not what the source produces. See
  # cassini-microsite/scripts/sync-embed.mjs for why it is committed at all.
  embed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: cassini-microsite/.nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install the web workspace
        run: npm ci

      - name: The committed embed is what the source builds
        run: node cassini-microsite/scripts/sync-embed.mjs --check

  # Deploy what the build job tested. `wrangler deploy` reads wrangler.jsonc
  # (Worker name, account, custom domains) and uploads ./dist as static assets.
  # Needs the CLOUDFLARE_API_TOKEN repo secret: an account token with the
  # "Edit Cloudflare Workers" permissions on the Code Myriad account.
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build, embed]
    runs-on: ubuntu-latest
    environment:
      name: gocassini.com
      url: https://gocassini.com
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: microsite-dist
          path: cassini-microsite/dist

      - name: Deploy to the gocassini Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: cassini-microsite
          command: deploy
