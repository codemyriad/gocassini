name: CI

on:
  push:
    branches:
      - main
      - master
    # Pure docs/planning changes touch no code, tests, or image — skip the
    # (expensive) suite. paths-ignore is a DENY-list: if any changed file falls
    # outside this list the whole suite still runs, so a real code change is
    # never silently skipped (avoids the allow-list false-green trap, cf. the
    # PR #36 note in publish-exapp-image.yml). spec/ is intentionally NOT here:
    # it holds the manifest JSON schemas that code validates against.
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'docs-wip/**'
      - 'dev-docs-wip/**'
      - 'planning/**'
      - 'img/**'
      - 'media-kit.*'
  pull_request:
    # `labeled` so adding the `full-ci` label re-triggers and runs the mute tier.
    types: [opened, synchronize, reopened, labeled]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'docs-wip/**'
      - 'dev-docs-wip/**'
      - 'planning/**'
      - 'img/**'
      - 'media-kit.*'

# Cancel a PR's superseded in-progress runs when a new commit is pushed, so
# rapid pushes don't stack multiple ~45-min e2e runs (a major source of the
# runner-minute burn that has been starving CI). Never cancel a push to main —
# every main commit must produce a full, independent signal.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  unit:
    name: Unit tests (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - cassini-go-recorder
          - cassini-operator
          - harness/go-talk-rotator
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          cache-dependency-path: ${{ matrix.module }}/go.sum
      - name: Install Go dependencies
        working-directory: ${{ matrix.module }}
        run: go mod download
      - name: Install media tools
        if: matrix.module == 'cassini-go-recorder'
        run: |
          # packages.microsoft.com intermittently 403s on GitHub-hosted runners,
          # which fails `apt-get update` (exit 100) even though nothing here
          # needs it. Drop any apt source referencing it before updating.
          sudo grep -rl packages.microsoft.com /etc/apt/sources.list.d/ 2>/dev/null | sudo xargs -r rm -f || true
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Vet
        working-directory: ${{ matrix.module }}
        run: go vet ./...
      - name: Run unit tests
        working-directory: ${{ matrix.module }}
        run: go test -race ./...

  integration:
    name: "Integration (${{ matrix.script }}${{ matrix.nextcloud_image && format(', {0}', matrix.nextcloud_image) || '' }})"
    runs-on: ubuntu-latest
    needs:
      - unit
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        script:
          - ci-e2e.sh
          - ci-e2e-rejoin.sh
          # ci-e2e-mute.sh is NOT in this matrix: it is a heavier 3-publisher
          # WebRTC scenario, so it runs in its own main/full-ci tier below.
        # Empty string selects the pinned default Nextcloud image in
        # harness/compose.yml. If the pinned leg goes red we broke it; if
        # only a compatibility leg goes red, upstream moved.
        nextcloud_image:
          - ""
        include:
          # NC33 compatibility leg: the hard requirement is "works with
          # NC33 and future versions", so exercise the oldest supported
          # major explicitly. Only the base e2e variant gets the extra leg
          # to keep CI minutes sane (mute/rejoin cover recorder behavior,
          # not Nextcloud version compatibility). Keep this image in sync
          # with the minimum major in appinfo/info.xml.
          - script: ci-e2e.sh
            nextcloud_image: "nextcloud:33"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: cassini-go-recorder/go.mod
          cache-dependency-path: |
            cassini-go-recorder/go.sum
            harness/go-talk-rotator/go.sum
      - name: Install runtime tools
        run: |
          # packages.microsoft.com intermittently 403s on GitHub-hosted runners,
          # which fails `apt-get update` (exit 100) even though nothing here
          # needs it. Drop any apt source referencing it before updating.
          sudo grep -rl packages.microsoft.com /etc/apt/sources.list.d/ 2>/dev/null | sudo xargs -r rm -f || true
          sudo apt-get update
          sudo apt-get install -y ffmpeg jq ripgrep
      - name: Run recorder integration test against local Nextcloud
        env:
          SPREED_PROFILE: full
          NEXTCLOUD_URL: "http://127.0.0.1:28080"
          SIGNALING_URL: "http://127.0.0.1:28082"
          BOT_PASSWORD: "ci-bot-password"
          NEXTCLOUD_IMAGE: ${{ matrix.nextcloud_image }}
        run: ./harness/bin/${{ matrix.script }}

  # ci-e2e-mute.sh exercises a heavier 3-publisher mute scenario. It now gates
  # audio rotation on recorder-side stream_opened evidence, so it runs once
  # instead of hiding recorder bring-up races behind a best-of-3 retry.
  integration-mute:
    name: "Integration (ci-e2e-mute.sh)"
    runs-on: ubuntu-latest
    needs:
      - unit
    # Run on push-to-main (gates the release path) and on a PR labeled `full-ci`;
    # keep it off the default PR run so PR signal stays deterministic.
    if: >-
      github.event_name != 'pull_request' ||
      contains(github.event.pull_request.labels.*.name, 'full-ci')
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: cassini-go-recorder/go.mod
          cache-dependency-path: |
            cassini-go-recorder/go.sum
            harness/go-talk-rotator/go.sum
      - name: Install runtime tools
        run: |
          # packages.microsoft.com intermittently 403s on GitHub-hosted runners,
          # which fails `apt-get update` (exit 100) even though nothing here
          # needs it. Drop any apt source referencing it before updating.
          sudo grep -rl packages.microsoft.com /etc/apt/sources.list.d/ 2>/dev/null | sudo xargs -r rm -f || true
          sudo apt-get update
          sudo apt-get install -y ffmpeg jq ripgrep
      - name: Run mute integration test against local Nextcloud
        env:
          SPREED_PROFILE: full
          NEXTCLOUD_URL: "http://127.0.0.1:28080"
          SIGNALING_URL: "http://127.0.0.1:28082"
          BOT_PASSWORD: "ci-bot-password"
          NEXTCLOUD_IMAGE: ""
        run: ./harness/bin/ci-e2e-mute.sh
      # Capture recorder/publisher logs + session artifact on failure so a
      # genuine (non-flake) regression can be triaged from the funnel summary and
      # per-subscriber ICE transitions instead of re-rolling CI.
      - name: Upload mute integration diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: mute-diagnostics
          path: |
            /tmp/gocassini-ci-recorder-mute.log
            /tmp/gocassini-ci-publisher-mute.log
            /tmp/gocassini-ci-mute-*.mkv
            /tmp/sessions/
          retention-days: 7
          if-no-files-found: ignore
