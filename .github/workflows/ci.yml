name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  unit:
    name: Unit tests (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - cassini-go-recorder
          - cassini-operator
          - harness/go-talk-rotator
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          cache-dependency-path: ${{ matrix.module }}/go.sum
      - name: Install Go dependencies
        working-directory: ${{ matrix.module }}
        run: go mod download
      - name: Install media tools
        if: matrix.module == 'cassini-go-recorder'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Vet
        working-directory: ${{ matrix.module }}
        run: go vet ./...
      - name: Run unit tests
        working-directory: ${{ matrix.module }}
        run: go test -race ./...

  integration:
    name: "Integration (${{ matrix.script }}${{ matrix.nextcloud_image && format(', {0}', matrix.nextcloud_image) || '' }})"
    runs-on: ubuntu-latest
    needs:
      - unit
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        script:
          - ci-e2e.sh
          - ci-e2e-rejoin.sh
          # ci-e2e-mute.sh is NOT in this matrix: its WebRTC ICE bring-up is
          # inherently racy (flake D-052, "got <3 participants"), so it runs in
          # its own best-of-N attempt matrix below (integration-mute).
        # Empty string selects the pinned default Nextcloud image in
        # harness/compose.yml. If the pinned leg goes red we broke it; if
        # only a compatibility leg goes red, upstream moved.
        nextcloud_image:
          - ""
        include:
          # NC33 compatibility leg: the hard requirement is "works with
          # NC33 and future versions", so exercise the oldest supported
          # major explicitly. Only the base e2e variant gets the extra leg
          # to keep CI minutes sane (mute/rejoin cover recorder behavior,
          # not Nextcloud version compatibility). Keep this image in sync
          # with the minimum major in appinfo/info.xml.
          - script: ci-e2e.sh
            nextcloud_image: "nextcloud:33"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: cassini-go-recorder/go.mod
          cache-dependency-path: |
            cassini-go-recorder/go.sum
            harness/go-talk-rotator/go.sum
      - name: Install runtime tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg jq ripgrep
      - name: Run recorder integration test against local Nextcloud
        env:
          SPREED_PROFILE: full
          NEXTCLOUD_URL: "http://127.0.0.1:28080"
          SIGNALING_URL: "http://127.0.0.1:28082"
          BOT_PASSWORD: "ci-bot-password"
          NEXTCLOUD_IMAGE: ${{ matrix.nextcloud_image }}
        run: ./harness/bin/${{ matrix.script }}

  # ci-e2e-mute.sh exercises a 3-publisher mute scenario whose WebRTC ICE
  # bring-up is inherently racy AND sensitive to runner contention: under load
  # only 2 of 3 subscribers reach ice_connected in time and the run asserts
  # "<3 participants" (flake D-052). Run it as a best-of-3 attempt matrix and
  # treat the leg as green if ANY attempt captured all participants. The
  # attempts run SEQUENTIALLY (max-parallel: 1) so they do not self-contend on
  # the shared runner and a transient bad window can pass between tries; an
  # attempt early-exits once an earlier one has already gone green. The
  # integration-mute-result job is the required status check.
  integration-mute:
    name: "Integration (ci-e2e-mute.sh) [attempt ${{ matrix.attempt }}]"
    runs-on: ubuntu-latest
    needs:
      - unit
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        attempt: [1, 2, 3]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: cassini-go-recorder/go.mod
          cache-dependency-path: |
            cassini-go-recorder/go.sum
            harness/go-talk-rotator/go.sum
      # Best-of-3 early-exit: if an earlier (sequential) attempt already passed,
      # skip the expensive e2e for this attempt — the gate only needs one green.
      - name: Look for an earlier green attempt
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: mute-green-*
          path: prior-green
          merge-multiple: true
      - name: Decide whether to run this attempt
        id: gate
        run: |
          mkdir -p prior-green
          if find prior-green -type f -name '*.green' | grep -q .; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::an earlier mute attempt already passed; skipping attempt ${{ matrix.attempt }}"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Install runtime tools
        if: steps.gate.outputs.skip != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg jq ripgrep
      - name: Run mute integration test against local Nextcloud
        if: steps.gate.outputs.skip != 'true'
        id: mute
        # A flaky attempt must not fail its own leg: the per-attempt jobs are
        # informational and best-of-3 tolerates individual failures. The
        # required status check is integration-mute-result, which is red only
        # when ALL attempts fail (a genuine regression). Note: to re-run a
        # mute that failed all attempts, re-run the whole run, not just failed
        # jobs (the legs report success here). steps.mute.outcome still holds
        # the true pass/fail and drives the green-marker / diagnostics steps.
        continue-on-error: true
        env:
          SPREED_PROFILE: full
          NEXTCLOUD_URL: "http://127.0.0.1:28080"
          SIGNALING_URL: "http://127.0.0.1:28082"
          BOT_PASSWORD: "ci-bot-password"
          NEXTCLOUD_IMAGE: ""
        run: ./harness/bin/ci-e2e-mute.sh
      - name: Record green attempt
        if: steps.gate.outputs.skip == 'true' || steps.mute.outcome == 'success'
        run: |
          mkdir -p mute-attempt-result
          echo "ok" > "mute-attempt-result/attempt-${{ matrix.attempt }}.green"
      - name: Upload green-attempt marker
        if: steps.gate.outputs.skip == 'true' || steps.mute.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: mute-green-${{ matrix.attempt }}
          path: mute-attempt-result/
          retention-days: 1
      # Capture recorder/publisher logs + session artifact on a failed attempt so a
      # genuine (non-flake) regression can be triaged from the funnel summary and
      # per-subscriber ICE transitions instead of re-rolling CI.
      - name: Upload mute integration diagnostics
        if: ${{ steps.mute.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: mute-diagnostics-attempt-${{ matrix.attempt }}
          path: |
            /tmp/gocassini-ci-recorder-mute.log
            /tmp/gocassini-ci-publisher-mute.log
            /tmp/gocassini-ci-mute-*.mkv
            /tmp/sessions/
          retention-days: 7
          if-no-files-found: ignore

  # Required status check for the mute scenario. Green if >=1 of the
  # integration-mute attempts captured all participants. Keep this job's name
  # exactly "Integration (ci-e2e-mute.sh)" so existing branch-protection
  # required checks keep resolving without reconfiguration.
  integration-mute-result:
    name: "Integration (ci-e2e-mute.sh)"
    runs-on: ubuntu-latest
    needs:
      - integration-mute
    if: always()
    steps:
      - name: Collect green-attempt markers
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: mute-green-*
          path: mute-green
          merge-multiple: true
      - name: Require at least one green attempt
        run: |
          mkdir -p mute-green
          count=$(find mute-green -type f -name '*.green' | wc -l)
          echo "ci-e2e-mute.sh green attempts: ${count} of 3"
          if [ "${count}" -ge 1 ]; then
            echo "::notice::ci-e2e-mute.sh passed best-of-3 (${count}/3 green) — flake D-052 absorbed"
            exit 0
          fi
          echo "::error::ci-e2e-mute.sh failed all 3 attempts — treat as a real failure, not a flake"
          exit 1
