name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  unit:
    name: Unit tests (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - cassini-go-recorder
          - cassini-operator
          - harness/go-talk-rotator
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          cache-dependency-path: ${{ matrix.module }}/go.sum
      - name: Install Go dependencies
        working-directory: ${{ matrix.module }}
        run: go mod download
      - name: Install media tools
        if: matrix.module == 'cassini-go-recorder'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Vet
        working-directory: ${{ matrix.module }}
        run: go vet ./...
      - name: Run unit tests
        working-directory: ${{ matrix.module }}
        run: go test -race ./...

  integration:
    name: "Integration (${{ matrix.script }}${{ matrix.nextcloud_image && format(', {0}', matrix.nextcloud_image) || '' }})"
    runs-on: ubuntu-latest
    needs:
      - unit
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        script:
          - ci-e2e.sh
          - ci-e2e-mute.sh
          - ci-e2e-rejoin.sh
        # Empty string selects the pinned default Nextcloud image in
        # harness/compose.yml. If the pinned leg goes red we broke it; if
        # only a compatibility leg goes red, upstream moved.
        nextcloud_image:
          - ""
        include:
          # NC33 compatibility leg: the hard requirement is "works with
          # NC33 and future versions", so exercise the oldest supported
          # major explicitly. Only the base e2e variant gets the extra leg
          # to keep CI minutes sane (mute/rejoin cover recorder behavior,
          # not Nextcloud version compatibility). Keep this image in sync
          # with the minimum major in appinfo/info.xml.
          - script: ci-e2e.sh
            nextcloud_image: "nextcloud:33"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: cassini-go-recorder/go.mod
          cache-dependency-path: |
            cassini-go-recorder/go.sum
            harness/go-talk-rotator/go.sum
      - name: Install runtime tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg jq ripgrep
      - name: Run recorder integration test against local Nextcloud
        env:
          SPREED_PROFILE: full
          NEXTCLOUD_URL: "http://127.0.0.1:28080"
          SIGNALING_URL: "http://127.0.0.1:28082"
          BOT_PASSWORD: "ci-bot-password"
          NEXTCLOUD_IMAGE: ${{ matrix.nextcloud_image }}
        run: ./harness/bin/${{ matrix.script }}
