name: CI

on:
  push:
    branches:
      - main
      - master
    # Pure docs/planning changes touch no code, tests, or image — skip the
    # (expensive) suite. paths-ignore is a DENY-list: if any changed file falls
    # outside this list the whole suite still runs, so a real code change is
    # never silently skipped (avoids the allow-list false-green trap the PR #36
    # incident demonstrated; scripts/classify-image-relevance.sh now applies the
    # same deny-list to the required faithful gate in publish-exapp-image.yml).
    # spec/ is intentionally NOT here: it holds the manifest JSON schemas that
    # code validates against.
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'docs-wip/**'
      - 'dev-docs-wip/**'
      - 'planning/**'
      - 'img/**'
      - 'media-kit.*'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'docs-wip/**'
      - 'dev-docs-wip/**'
      - 'planning/**'
      - 'img/**'
      - 'media-kit.*'

# Cancel a PR's superseded in-progress runs when a new commit is pushed, so
# rapid pushes don't stack multiple ~45-min e2e runs (a major source of the
# runner-minute burn that has been starving CI). Never cancel a push to main —
# every main commit must produce a full, independent signal.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  contracts:
    name: Fast manifest + harness contracts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install contract tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends jq libxml2-utils xsltproc shellcheck
      - name: Validate App Store manifest schema
        run: ./scripts/test-info-schema.sh
      - name: Test faithful-gate change classifier (deny-list)
        # Offline unit test for scripts/classify-image-relevance.sh: the ALL-docs
        # deny-list predicate, the load-bearing empty-path guard, and a drift
        # assertion that this deny-list still matches ci.yml's paths-ignore (D-505).
        run: ./scripts/test-classify-image-relevance.sh
      - name: Test newest-stable FFmpeg resolver
        run: ./deployment/ffmpeg/test-resolve-latest.sh
      - name: Run offline harness regressions
        run: |
          ./harness/bin/test-base-helpers.sh
          ./harness/bin/test-exapp-image-ref.sh
          ./harness/bin/test-exapp-manifest.sh
          ./harness/bin/test-installed-validation.sh
          ./harness/bin/test-faithful-host-tools.sh
          ./harness/bin/test-installed-backend-url.sh
          ./harness/bin/test-stack-resume.sh
          ./harness/bin/test-post-boundary-stream.sh
          ./harness/bin/test-ci-e2e-mute-timing.sh
          ./harness/bin/test-negative-manifest.sh
          ./harness/bin/test-harness-prerequisites.sh
      - name: Parse every harness shell script
        run: |
          set -euo pipefail
          while IFS= read -r -d '' script; do
            bash -n "$script"
          done < <(find harness/bin -type f -name '*.sh' -print0)
      - name: Shellcheck D-453 contract scripts
        run: >-
          shellcheck
          deployment/ffmpeg/resolve-latest.sh
          deployment/ffmpeg/build.sh
          deployment/ffmpeg/test-resolve-latest.sh
          harness/bin/ci-ffmpeg-bundle.sh
          scripts/test-info-schema.sh
          harness/bin/lib-exapp-manifest.sh
          harness/bin/test-exapp-image-ref.sh
          harness/bin/test-exapp-manifest.sh
          harness/bin/test-installed-validation.sh
          harness/bin/test-faithful-host-tools.sh
          harness/bin/test-installed-backend-url.sh
          harness/bin/test-stack-resume.sh
          harness/bin/validate-installed-artifact.sh
          harness/bin/validate-installed-exapp-private-talk.sh
          harness/bin/ci-e2e-installed-exapp-talk.sh
          harness/bin/test-post-boundary-stream.sh
          harness/bin/verify-post-boundary-stream.sh
          harness/bin/test-negative-manifest.sh
          harness/bin/test-harness-prerequisites.sh
      - name: Compile D-453 Python helpers
        run: |
          python3 -m py_compile harness/bin/installed-validation.py
          python3 -m py_compile harness/bin/make-negative-manifest.py

  ui:
    name: UI tests (${{ matrix.package }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - cassini-viewer
          - cassini-app
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: '**/package-lock.json'
      # cassini-app consumes cassini-viewer via the npm workspace (D-420), so it
      # can't be installed standalone. Install at the workspace root, then test
      # the one package via -w, matching deployment/Dockerfile.exapp.
      #
      # `npm ci`, not `npm install`: D-578 committed the root lockfile, so the
      # install is reproducible and CI can no longer silently resolve a different
      # dependency tree than the lockfile pins.
      - name: Install workspace
        run: npm ci
      - name: Run tests
        run: npm test -w ${{ matrix.package }}

  # Browser coverage for source capture (docs/source-audio-capture.md). Its own
  # job rather than a `ui` matrix entry because it needs a real Chromium, which
  # the unit matrix has no reason to install.
  #
  # What it covers: the service worker appending the capture payload to Talk's
  # bundle, the payload finding the outgoing audio sender on a real
  # RTCPeerConnection, the encoded transform reading outgoing RTP timestamps,
  # OPFS buffering, mute observation, and the post-call upload — under a stub
  # call that drops a share of the encoded frames on the receiving side, which
  # is the lossy-uplink condition the feature exists for.
  #
  # What it does NOT cover, so a green run is not mistaken for more: real
  # Nextcloud, real Talk, real Janus, AppAPI's proxy and its header forwarding,
  # and the operator's Go upload handler (covered by its own tests). The
  # harness has no browser at all — its Talk publishers are pion Go clients —
  # so this is the only place any of the browser chain runs.
  capture-e2e:
    name: Browser e2e (source capture)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: '**/package-lock.json'
      - name: Install workspace
        run: npm ci
      # Chromium only: the chain needs fake-device getUserMedia, WebRTC encoded
      # transforms and OPFS sync access handles together, and Chromium is the
      # one engine where all three are drivable headlessly. --with-deps because
      # the runner image does not carry Chromium's shared libraries.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      # The service worker serves the BUILT bundles, so the build is part of
      # what is under test: a bundling change that breaks the payload fails
      # here rather than in production.
      - name: Build capture bundles
        run: npm run build:capture -w cassini-app
      - name: Run browser tests
        run: npm run test:e2e -w cassini-app

  unit:
    name: Unit tests (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - cassini-go-recorder
          - cassini-operator
          - harness/go-talk-rotator
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          cache-dependency-path: ${{ matrix.module }}/go.sum
      - name: Install Go dependencies
        working-directory: ${{ matrix.module }}
        run: go mod download
      - name: Install media tools
        if: matrix.module == 'cassini-go-recorder'
        run: |
          # packages.microsoft.com intermittently 403s on GitHub-hosted runners,
          # which fails `apt-get update` (exit 100) even though nothing here
          # needs it. Drop any apt source referencing it before updating.
          sudo grep -rl packages.microsoft.com /etc/apt/sources.list.d/ 2>/dev/null | sudo xargs -r rm -f || true
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      # gofmt lives in lint.yml, with shellcheck and actionlint — see the note
      # there. It was here only while Lint was advisory.
      - name: Vet
        working-directory: ${{ matrix.module }}
        run: go vet ./...
      - name: Run unit tests
        working-directory: ${{ matrix.module }}
        run: go test -race ./...

  integration:
    name: "Integration (${{ matrix.script }}${{ matrix.nextcloud_image && format(', {0}', matrix.nextcloud_image) || '' }})"
    runs-on: ubuntu-latest
    needs:
      - unit
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        script:
          - ci-e2e.sh
          - ci-e2e-private.sh
          - ci-e2e-rejoin.sh
          # ci-e2e-mute.sh is NOT in this matrix: it is a heavier 3-publisher
          # WebRTC scenario with its own readiness gate, so it runs as its own
          # job below (on every PR, like this one).
        # Empty string selects the pinned default Nextcloud image in
        # harness/compose.yml. If the pinned leg goes red we broke it; if
        # only a compatibility leg goes red, upstream moved.
        nextcloud_image:
          - ""
        include:
          # NC33 compatibility leg: the hard requirement is "works with
          # NC33 and future versions", so exercise the oldest supported
          # major explicitly. Only the base e2e variant gets the extra leg
          # to keep CI minutes sane (mute/rejoin cover recorder behavior,
          # not Nextcloud version compatibility). Keep this image in sync
          # with the minimum major in appinfo/info.xml.
          - script: ci-e2e.sh
            nextcloud_image: "nextcloud:33"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: cassini-go-recorder/go.mod
          cache-dependency-path: |
            cassini-go-recorder/go.sum
            harness/go-talk-rotator/go.sum
      - name: Install runtime tools
        run: |
          # packages.microsoft.com intermittently 403s on GitHub-hosted runners,
          # which fails `apt-get update` (exit 100) even though nothing here
          # needs it. Drop any apt source referencing it before updating.
          sudo grep -rl packages.microsoft.com /etc/apt/sources.list.d/ 2>/dev/null | sudo xargs -r rm -f || true
          sudo apt-get update
          sudo apt-get install -y ffmpeg jq ripgrep
      - name: Run recorder integration test against local Nextcloud
        env:
          SPREED_PROFILE: full
          NEXTCLOUD_URL: "http://127.0.0.1:28080"
          SIGNALING_URL: "http://127.0.0.1:28082"
          BOT_PASSWORD: "ci-bot-password"
          NEXTCLOUD_IMAGE: ${{ matrix.nextcloud_image }}
        run: ./harness/bin/${{ matrix.script }}

  # ci-e2e-mute.sh exercises a heavier 3-publisher mute scenario. It now gates
  # audio rotation on recorder-side stream_opened evidence, so it runs once
  # instead of hiding recorder bring-up races behind a best-of-3 retry.
  integration-mute:
    name: "Integration (ci-e2e-mute.sh)"
    runs-on: ubuntu-latest
    needs:
      - unit
    # Runs on EVERY PR (and push-to-main). The mute scenario is exactly the kind
    # of regression we kept missing by gating heavy e2e behind `full-ci`, so it
    # must gate every PR, not just labeled ones. (Deflaked: see the larger ICE
    # budget + stagger in ci-e2e-mute.sh and the D-444 readiness gate.)
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: cassini-go-recorder/go.mod
          cache-dependency-path: |
            cassini-go-recorder/go.sum
            harness/go-talk-rotator/go.sum
      - name: Install runtime tools
        run: |
          # packages.microsoft.com intermittently 403s on GitHub-hosted runners,
          # which fails `apt-get update` (exit 100) even though nothing here
          # needs it. Drop any apt source referencing it before updating.
          sudo grep -rl packages.microsoft.com /etc/apt/sources.list.d/ 2>/dev/null | sudo xargs -r rm -f || true
          sudo apt-get update
          sudo apt-get install -y ffmpeg jq ripgrep
      - name: Run mute integration test against local Nextcloud
        env:
          SPREED_PROFILE: full
          NEXTCLOUD_URL: "http://127.0.0.1:28080"
          SIGNALING_URL: "http://127.0.0.1:28082"
          BOT_PASSWORD: "ci-bot-password"
          NEXTCLOUD_IMAGE: ""
        run: ./harness/bin/ci-e2e-mute.sh
      # Capture recorder/publisher logs + session artifact on failure so a
      # genuine (non-flake) regression can be triaged from the funnel summary and
      # per-subscriber ICE transitions instead of re-rolling CI.
      - name: Upload mute integration diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: mute-diagnostics
          path: |
            /tmp/gocassini-ci-recorder-mute.log
            /tmp/gocassini-ci-publisher-mute.log
            /tmp/gocassini-ci-mute-*.mkv
            /tmp/sessions/
          retention-days: 7
          if-no-files-found: ignore
