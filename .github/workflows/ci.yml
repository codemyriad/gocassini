name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  unit:
    name: Unit tests (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - cassini-go-recorder
          - test/go-talk-rotator
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: ${{ matrix.module }}/go.mod
      - name: Install Go dependencies
        working-directory: ${{ matrix.module }}
        run: go mod download
      - name: Run unit tests
        working-directory: ${{ matrix.module }}
        run: go test ./...

  integration:
    name: Integration (local Nextcloud Talk)
    runs-on: ubuntu-latest
    needs: unit
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: cassini-go-recorder/go.mod
      - name: Install runtime tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Run recorder integration test against local Nextcloud
        env:
          SPREED_PROFILE: full
          REC_DURATION: 22
          PUB_DURATION: 18
          PUB_USERS: 1
          NEXTCLOUD_URL: "http://127.0.0.1:18080"
          SIGNALING_URL: "http://127.0.0.1:18082"
          BOT_PASSWORD: "ci-bot-password"
        run: ./test/bin/ci-e2e.sh
