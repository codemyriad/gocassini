name: CI

on:
  push:
    branches:
      - main
      - master
    # Pure docs/planning changes touch no code, tests, or image — skip the
    # (expensive) suite. paths-ignore is a DENY-list: if any changed file falls
    # outside this list the workflow still runs, so a real code change is
    # never silently skipped (avoids the allow-list false-green trap the PR #36
    # incident demonstrated; scripts/classify-image-relevance.sh now applies the
    # same deny-list to the required faithful gate in publish-exapp-image.yml).
    # spec/ is intentionally NOT here: it holds the manifest JSON schemas that
    # code validates against.
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'docs-wip/**'
      - 'dev-docs-wip/**'
      - 'planning/**'
      - 'img/**'
      - 'media-kit.*'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'docs-wip/**'
      - 'dev-docs-wip/**'
      - 'planning/**'
      - 'img/**'
      - 'media-kit.*'

# Cancel a PR's superseded in-progress runs when a new commit is pushed, so
# rapid pushes don't stack multiple ~45-min e2e runs (a major source of the
# runner-minute burn that has been starving CI). Never cancel a push to main —
# every main commit must produce a full, independent signal.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  contracts:
    name: Fast manifest + harness contracts
    runs-on: ubuntu-latest
    outputs:
      recorder-integration: ${{ steps.changes.outputs.relevant }}
      recorder-matrix: ${{ steps.matrix.outputs.value }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Classify standalone recorder integration relevance
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          relevant=true
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            # Include deletions and both sides of renames. Two-dot deliberately
            # over-reports base-branch changes; uncertainty runs the suite.
            if changed="$(git diff --no-renames --name-only "$BASE_SHA" "$HEAD_SHA")"; then
              relevant="$(printf '%s\n' "$changed" | ./scripts/classify-recorder-integration-relevance.sh)"
            else
              echo "::warning::Cannot compute diff; running recorder integration"
            fi
          fi
          echo "relevant=$relevant" >> "$GITHUB_OUTPUT"
          echo "Standalone recorder integration relevant: $relevant" >> "$GITHUB_STEP_SUMMARY"
      - name: Derive recorder matrix from compatibility inventory
        id: matrix
        run: echo "value=$(python3 scripts/nextcloud_compatibility.py matrix --tier recorder)" >> "$GITHUB_OUTPUT"
      - name: Check compatibility contracts
        run: |
          python3 scripts/nextcloud_compatibility.py validate
          python3 -m unittest discover -s scripts -p 'test_*compatibility*.py'
      - name: Install contract tools
        run: |
          sudo ./scripts/ci-apt-update.sh
          sudo apt-get install -y --no-install-recommends jq libxml2-utils xsltproc shellcheck
      - name: Validate App Store manifest schema
        run: ./scripts/test-info-schema.sh
      - name: Test faithful-gate change classifier (deny-list)
        # Offline unit test for scripts/classify-image-relevance.sh: the ALL-docs
        # deny-list predicate, the load-bearing empty-path guard, and a drift
        # assertion that this deny-list still matches ci.yml's paths-ignore (D-505).
        run: ./scripts/test-classify-image-relevance.sh
      - name: Test standalone recorder integration classifier
        run: ./scripts/test-classify-recorder-integration-relevance.sh
      - name: Test newest-stable FFmpeg resolver
        run: ./deployment/ffmpeg/test-resolve-latest.sh
      - name: Run offline harness regressions
        run: |
          ./harness/bin/test-base-helpers.sh
          ./harness/bin/test-exapp-image-ref.sh
          ./harness/bin/test-exapp-manifest.sh
          ./harness/bin/test-installed-validation.sh
          ./harness/bin/test-faithful-host-tools.sh
          ./harness/bin/test-installed-backend-url.sh
          ./harness/bin/test-stack-resume.sh
          ./harness/bin/test-post-boundary-stream.sh
          ./harness/bin/test-ci-e2e-mute-timing.sh
          ./harness/bin/test-negative-manifest.sh
          ./harness/bin/test-harness-prerequisites.sh
      - name: Parse every harness shell script
        run: |
          set -euo pipefail
          while IFS= read -r -d '' script; do
            bash -n "$script"
          done < <(find harness/bin -type f -name '*.sh' -print0)
      - name: Shellcheck D-453 contract scripts
        run: >-
          shellcheck
          deployment/ffmpeg/resolve-latest.sh
          deployment/ffmpeg/build.sh
          deployment/ffmpeg/test-resolve-latest.sh
          harness/bin/ci-ffmpeg-bundle.sh
          scripts/test-info-schema.sh
          harness/bin/lib-exapp-manifest.sh
          harness/bin/test-exapp-image-ref.sh
          harness/bin/test-exapp-manifest.sh
          harness/bin/test-installed-validation.sh
          harness/bin/test-faithful-host-tools.sh
          harness/bin/test-installed-backend-url.sh
          harness/bin/test-stack-resume.sh
          harness/bin/validate-installed-artifact.sh
          harness/bin/validate-installed-exapp-private-talk.sh
          harness/bin/ci-e2e-installed-exapp-talk.sh
          harness/bin/test-post-boundary-stream.sh
          harness/bin/verify-post-boundary-stream.sh
          harness/bin/test-negative-manifest.sh
          harness/bin/test-harness-prerequisites.sh
      - name: Compile D-453 Python helpers
        run: |
          python3 -m py_compile harness/bin/installed-validation.py
          python3 -m py_compile harness/bin/make-negative-manifest.py

  ui:
    name: UI tests (${{ matrix.package }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - cassini-viewer
          - cassini-app
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: '**/package-lock.json'
      # cassini-app consumes cassini-viewer via the npm workspace (D-420), so it
      # can't be installed standalone. Install at the workspace root, then test
      # the one package via -w, matching deployment/Dockerfile.exapp.
      #
      # `npm ci`, not `npm install`: D-578 committed the root lockfile, so the
      # install is reproducible and CI can no longer silently resolve a different
      # dependency tree than the lockfile pins.
      - name: Install workspace
        run: npm ci
      - name: Run tests
        run: npm test -w ${{ matrix.package }}

  unit:
    name: Unit tests (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - cassini-go-recorder
          - cassini-operator
          - harness/go-talk-rotator
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          cache-dependency-path: ${{ matrix.module }}/go.sum
      - name: Install Go dependencies
        working-directory: ${{ matrix.module }}
        run: go mod download
      - name: Install media tools
        # The operator needs them too: its CLI byte-parity test
        # (TestMeetingsContextBytesMatchTheCLIOverTheSameIDs) packs a real
        # portable meeting with ffmpeg and silently skips without it (D-740).
        if: matrix.module == 'cassini-go-recorder' || matrix.module == 'cassini-operator'
        run: |
          # A vendor apt source we never install from can fail `apt-get update`
          # (exit 100) and take this step with it. ci-apt-update.sh drops every
          # source that is not the Ubuntu archive first — see the note there.
          sudo ./scripts/ci-apt-update.sh
          sudo apt-get install -y ffmpeg
      # gofmt lives in lint.yml, with shellcheck and actionlint — see the note
      # there. It was here only while Lint was advisory.
      - name: Vet
        working-directory: ${{ matrix.module }}
        run: go vet ./...
      - name: Run unit tests
        working-directory: ${{ matrix.module }}
        run: go test -race ./...

      # Real recognition belongs in ordinary PR CI. FP32 runs on the hosted
      # CPU runner; neither full-ci nor a self-hosted GPU is needed. The tag
      # keeps model loading out of fast local unit runs, not out of CI.
      - name: Restore synthetic ASR models
        if: matrix.module == 'cassini-go-recorder'
        id: asr-models
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/synthetic-asr-models
          key: synthetic-asr-fp32-v1-${{ hashFiles('deployment/models/fetch-models.sh', 'cassini-go-recorder/internal/transcribe/testdata/synthetic-boundary/models.sha256') }}
      - name: Prepare and verify synthetic ASR models
        if: matrix.module == 'cassini-go-recorder'
        timeout-minutes: 15
        env:
          CASSINI_CACHE_ROOT: ${{ runner.temp }}/synthetic-asr-models
        run: |
          set -euo pipefail
          if [[ ! -d "$CASSINI_CACHE_ROOT/models/parakeet-tdt-0.6b-v3" ]]; then
            ./deployment/models/fetch-models.sh "$CASSINI_CACHE_ROOT" parakeet-tdt-0.6b-v3
          fi
          mkdir -p "$CASSINI_CACHE_ROOT/vad"
          if [[ ! -s "$CASSINI_CACHE_ROOT/vad/silero_vad.onnx" ]]; then
            curl --fail --location --retry 3 \
              https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/silero_vad.onnx \
              -o "$CASSINI_CACHE_ROOT/vad/silero_vad.onnx"
          fi
          cd "$CASSINI_CACHE_ROOT"
          sha256sum --check "$GITHUB_WORKSPACE/cassini-go-recorder/internal/transcribe/testdata/synthetic-boundary/models.sha256"
      # Save verified inputs before assertions: a real recognition failure
      # must not force another multi-gigabyte download on the next run.
      - name: Cache verified synthetic ASR models
        if: matrix.module == 'cassini-go-recorder' && steps.asr-models.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/synthetic-asr-models
          key: ${{ steps.asr-models.outputs.cache-primary-key }}
      - name: Build synthetic ASR regression tests
        if: matrix.module == 'cassini-go-recorder'
        timeout-minutes: 5
        env:
          ASR_TEST_BINARY: ${{ runner.temp }}/synthetic-asr.test
        run: |
          go -C cassini-go-recorder test -c -p 2 -tags asrregression -o "$ASR_TEST_BINARY" ./internal/transcribe
      - name: Run synthetic speech regressions (CPU, FP32)
        if: matrix.module == 'cassini-go-recorder'
        timeout-minutes: 5
        working-directory: cassini-go-recorder/internal/transcribe
        env:
          CASSINI_CACHE_ROOT: ${{ runner.temp }}/synthetic-asr-models
          CASSINI_BUNDLED_MODEL_ROOT: ${{ runner.temp }}/synthetic-asr-models
          CASSINI_BUNDLED_MODELS: parakeet-tdt-0.6b-v3
          CASSINI_DISALLOW_MODEL_DOWNLOAD: "1"
          CASSINI_ASR_REGRESSION_DEVICE: cpu
          ASR_TEST_BINARY: ${{ runner.temp }}/synthetic-asr.test
          ASR_TEST_LOG: ${{ runner.temp }}/synthetic-asr.log
        run: |
          set -euo pipefail
          "$ASR_TEST_BINARY" -test.run '^TestSynthetic' -test.count=1 -test.v -test.timeout=5m 2>&1 | tee "$ASR_TEST_LOG"
      - name: Upload synthetic ASR results
        if: always() && matrix.module == 'cassini-go-recorder'
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-asr-cpu-results
          path: ${{ runner.temp }}/synthetic-asr.log
          if-no-files-found: ignore
          retention-days: 7

  integration:
    name: "Integration (${{ matrix.script }}${{ matrix.nextcloud_image && format(', {0}', matrix.nextcloud_image) || '' }})"
    runs-on: ubuntu-latest
    needs:
      - contracts
      - unit
    if: needs.contracts.outputs.recorder-integration == 'true'
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.contracts.outputs.recorder-matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: cassini-go-recorder/go.mod
          cache-dependency-path: |
            cassini-go-recorder/go.sum
            harness/go-talk-rotator/go.sum
      - name: Install runtime tools
        run: |
          # A vendor apt source we never install from can fail `apt-get update`
          # (exit 100) and take this step with it. ci-apt-update.sh drops every
          # source that is not the Ubuntu archive first — see the note there.
          sudo ./scripts/ci-apt-update.sh
          sudo apt-get install -y ffmpeg jq ripgrep build-essential cmake curl git patch unzip
      - name: Run recorder integration test against local Nextcloud
        env:
          SPREED_PROFILE: full
          NEXTCLOUD_URL: "http://127.0.0.1:28080"
          SIGNALING_URL: "http://127.0.0.1:28082"
          BOT_PASSWORD: "ci-bot-password"
          NEXTCLOUD_IMAGE: ${{ matrix.nextcloud_image }}
        run: ./harness/bin/${{ matrix.script }}

  # ci-e2e-mute.sh exercises a heavier 3-publisher mute scenario. It now gates
  # audio rotation on recorder-side stream_opened evidence, so it runs once
  # instead of hiding recorder bring-up races behind a best-of-3 retry.
  integration-mute:
    name: "Integration (ci-e2e-mute.sh)"
    runs-on: ubuntu-latest
    needs:
      - contracts
      - unit
    if: needs.contracts.outputs.recorder-integration == 'true'
    # Runs on every relevant PR and every push-to-main, without a label gate.
    # Only known unrelated changes skip these standalone recorder scenarios;
    # packaged operator/UI coverage stays in publish-exapp-image.yml.
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: cassini-go-recorder/go.mod
          cache-dependency-path: |
            cassini-go-recorder/go.sum
            harness/go-talk-rotator/go.sum
      - name: Install runtime tools
        run: |
          # A vendor apt source we never install from can fail `apt-get update`
          # (exit 100) and take this step with it. ci-apt-update.sh drops every
          # source that is not the Ubuntu archive first — see the note there.
          sudo ./scripts/ci-apt-update.sh
          sudo apt-get install -y ffmpeg jq ripgrep build-essential cmake curl git patch unzip
      - name: Run mute integration test against local Nextcloud
        env:
          SPREED_PROFILE: full
          NEXTCLOUD_URL: "http://127.0.0.1:28080"
          SIGNALING_URL: "http://127.0.0.1:28082"
          BOT_PASSWORD: "ci-bot-password"
          NEXTCLOUD_IMAGE: ${{ fromJSON(needs.contracts.outputs.recorder-matrix).include[0].nextcloud_image }}
        run: ./harness/bin/ci-e2e-mute.sh
      # Capture recorder/publisher logs + session artifact on failure so a
      # genuine (non-flake) regression can be triaged from the funnel summary and
      # per-subscriber ICE transitions instead of re-rolling CI.
      - name: Upload mute integration diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: mute-diagnostics
          path: |
            /tmp/gocassini-ci-recorder-mute.log
            /tmp/gocassini-ci-publisher-mute.log
            /tmp/gocassini-ci-mute-*.mkv
            /tmp/sessions/
          retention-days: 7
          if-no-files-found: ignore
