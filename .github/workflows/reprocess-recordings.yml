name: Reprocess Recordings

on:
  workflow_dispatch:
    inputs:
      run_processing:
        description: Run branch-scoped processing for the currently selected ref
        type: boolean
        default: false

# Serialize manual processing jobs on george to avoid racing over shared GPU
# and branch-scoped working directories.
concurrency:
  group: george-reprocess
  cancel-in-progress: false

jobs:
  reprocess:
    if: github.event.inputs.run_processing == 'true'
    runs-on: [self-hosted, george]
    env:
      BRANCH: ${{ github.ref_name }}
      PREVIEW_ROOT: /mnt/data/cassini/reprocess
      RCLONE_CONFIG_CODEMYRIAD_TYPE: s3
      RCLONE_CONFIG_CODEMYRIAD_PROVIDER: Cloudflare
      RCLONE_CONFIG_CODEMYRIAD_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      RCLONE_CONFIG_CODEMYRIAD_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      RCLONE_CONFIG_CODEMYRIAD_ENDPOINT: ${{ secrets.R2_S3_ENDPOINT }}
      RCLONE_CONFIG_CODEMYRIAD_ACL: private
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: cassini-go-recorder/go.mod
          cache-dependency-path: cassini-go-recorder/go.sum

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cassini-viewer/package-lock.json

      - name: Encode branch name
        run: |
          ENCODED=$(echo "$BRANCH" | sed 's|/|--|g')
          echo "ENCODED_BRANCH=$ENCODED" >> $GITHUB_ENV
          echo "WORK_ROOT=${PREVIEW_ROOT}/$ENCODED" >> $GITHUB_ENV
          echo "RAW_DIR=${PREVIEW_ROOT}/$ENCODED/raw" >> $GITHUB_ENV
          echo "PROC_DIR=${PREVIEW_ROOT}/$ENCODED/processed" >> $GITHUB_ENV
          echo "CASSINI_CACHE_ROOT=${PREVIEW_ROOT}/$ENCODED/.cache" >> $GITHUB_ENV
          echo "EXPORT_DIR=/tmp/cassini-export-${{ github.run_id }}" >> $GITHUB_ENV
          echo "CASSINI_BUILD_DIR=/tmp/cassini-build-${{ github.run_id }}" >> $GITHUB_ENV

      - name: Runner preflight
        run: |
          set -euo pipefail
          for cmd in git rclone ffmpeg ffprobe node npm nvidia-smi; do
            command -v "$cmd" >/dev/null || {
              echo "missing required command: $cmd" >&2
              exit 1
            }
          done
          nvidia-smi >/dev/null
          mkdir -p "$RAW_DIR" "$PROC_DIR" "$CASSINI_CACHE_ROOT"

      - name: Download raw recordings
        run: |
          mkdir -p "$RAW_DIR" "$PROC_DIR"
          rclone copy codemyriad:cassini-raw/daily/ "$RAW_DIR/"

      - name: Build cassini from checked-out commit
        run: |
          mkdir -p "$CASSINI_BUILD_DIR"
          go -C cassini-go-recorder build \
            -o "$CASSINI_BUILD_DIR/cassini" \
            ./cmd/cassini

      - name: Process recordings with GPU
        env:
          DEVICE: cuda
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          RECORDINGS_DIR="$RAW_DIR" \
          PROCESSED_DIR="$PROC_DIR" \
          CASSINI_BIN="$CASSINI_BUILD_DIR/cassini" \
          CASSINI_CACHE_ROOT="$CASSINI_CACHE_ROOT" \
          bash ops/process-recordings.sh

      - name: Build and export viewer
        working-directory: cassini-viewer
        run: |
          npm ci
          npm run export:meetings -- \
            --source-dir "$PROC_DIR" \
            --output-dir "$EXPORT_DIR"

      - name: Upload viewer and meetings
        run: |
          rclone copy "${EXPORT_DIR}/" \
            "codemyriad:cassini-processed/${ENCODED_BRANCH}/"
          HASH=$(git rev-parse HEAD:cassini-go-recorder HEAD:ops/process-recordings.sh HEAD:bin/cassini | sha256sum | cut -c1-16)
          echo "$HASH" | rclone rcat "codemyriad:cassini-processed/${ENCODED_BRANCH}/.processing-hash"

      - name: Cleanup temp files
        if: always()
        run: |
          rm -rf /tmp/cassini-export-${{ github.run_id }}
          rm -rf /tmp/cassini-build-${{ github.run_id }}
