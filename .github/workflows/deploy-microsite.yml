name: Deploy Microsite

# Build + publish the Astro microsite (cassini-microsite/) to Cloudflare R2.
#
# Topology (single bucket, served at https://gocassini.codemyriad.io):
#   * push to main        -> bucket ROOT  -> https://gocassini.codemyriad.io/
#   * pull_request / branch -> _preview/<encoded-branch>/
#                            -> https://gocassini.codemyriad.io/_preview/<branch>/
#
# Previews live under a reserved _preview/ namespace so the production (root)
# sync can prune stale files with --delete-during while excluding _preview/**,
# i.e. a main deploy never wipes in-flight PR previews.
#
# The site is served under a path prefix for previews, so the build sets
# BASE_PATH -> astro.config.mjs `base` -> import.meta.env.BASE_URL, keeping
# asset URLs and links correct. Production builds with BASE_PATH=/ (root).
#
# Reuses deploy-preview.yml's R2 secrets (R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY,
# R2_S3_ENDPOINT). No new secrets. The gocassini.codemyriad.io custom domain must
# be mapped to this bucket in the Cloudflare R2 dashboard (one-time manual step).

on:
  push:
    branches: [main]
    paths:
      - 'cassini-microsite/**'
      - '.github/workflows/deploy-microsite.yml'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'cassini-microsite/**'
      - '.github/workflows/deploy-microsite.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # One live deploy per ref; newer pushes supersede in-flight ones.
  group: microsite-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    # Secrets are unavailable to fork PRs, so an rclone publish there would only
    # fail noisily. Restrict to same-repo refs (matches deploy-preview.yml).
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      R2_BUCKET: cassini-microsite
      SITE_URL: https://gocassini.codemyriad.io
      RCLONE_CONFIG_CODEMYRIAD_TYPE: s3
      RCLONE_CONFIG_CODEMYRIAD_PROVIDER: Cloudflare
      RCLONE_CONFIG_CODEMYRIAD_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      RCLONE_CONFIG_CODEMYRIAD_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      RCLONE_CONFIG_CODEMYRIAD_ENDPOINT: ${{ secrets.R2_S3_ENDPOINT }}
      RCLONE_CONFIG_CODEMYRIAD_ACL: private
    steps:
      - uses: actions/checkout@v4

      - name: Resolve deploy target
        id: vars
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/main" ]; then
            # Production: bucket root.
            echo "mode=production"        >> "$GITHUB_OUTPUT"
            echo "prefix="                >> "$GITHUB_OUTPUT"
            echo "base_path=/"            >> "$GITHUB_OUTPUT"
            echo "url=${SITE_URL}/"       >> "$GITHUB_OUTPUT"
          else
            if [ "${{ github.event_name }}" = "pull_request" ]; then
              BRANCH="${{ github.head_ref }}"
            else
              BRANCH="${{ github.ref_name }}"
            fi
            # Encode '/' like deploy-preview.yml so nested branch names stay flat.
            ENCODED_BRANCH="$(echo "$BRANCH" | sed 's|/|--|g')"
            echo "mode=preview"                                   >> "$GITHUB_OUTPUT"
            echo "prefix=_preview/${ENCODED_BRANCH}/"             >> "$GITHUB_OUTPUT"
            echo "base_path=/_preview/${ENCODED_BRANCH}/"         >> "$GITHUB_OUTPUT"
            echo "url=${SITE_URL}/_preview/${ENCODED_BRANCH}/"    >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cassini-microsite/package-lock.json

      - name: Install rclone
        run: curl -fsSL https://rclone.org/install.sh | sudo bash

      - name: Build site
        working-directory: cassini-microsite
        env:
          BASE_PATH: ${{ steps.vars.outputs.base_path }}
        run: |
          set -euo pipefail
          npm ci
          npm run build

      - name: Publish to R2
        env:
          MODE: ${{ steps.vars.outputs.mode }}
          PREFIX: ${{ steps.vars.outputs.prefix }}
        run: |
          set -euo pipefail
          DEST="codemyriad:${R2_BUCKET}/${PREFIX}"
          # --checksum keeps re-deploys cheap (only changed objects upload).
          if [ "$MODE" = "production" ]; then
            # Prune stale production files but never touch preview namespaces.
            rclone sync cassini-microsite/dist/ "$DEST" \
              --checksum --delete-during --exclude '_preview/**'
          else
            rclone sync cassini-microsite/dist/ "$DEST" \
              --checksum --delete-during
          fi

      - name: Summary
        env:
          URL: ${{ steps.vars.outputs.url }}
        run: |
          {
            echo "### Microsite deployed :rocket:"
            echo ""
            echo "**${{ steps.vars.outputs.mode }}** → <${URL}>"
          } >> "$GITHUB_STEP_SUMMARY"
