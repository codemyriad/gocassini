name: Build + publish ExApp image

on:
  push:
    branches:
      - main
      # WIP integration branch — pushes from here also publish :latest and
      # :latest-cuda. While this branch is open, "latest" tracks the
      # combined-PRs WIP, not main. Drop the branch once it merges to main.
      - e2e-v3-cpu-gpu
    tags:
      - 'v*'
  pull_request:
    paths:
      - 'appinfo/info.xml'
      - 'deployment/Dockerfile.exapp'
      - 'deployment/exapp-start.sh'
      - 'deployment/exapp-healthcheck.sh'
      - 'cassini-operator/**'
      - 'cassini-go-recorder/**'
      - 'cassini-publisher/bin/**'
      - 'cassini-viewer/**'
      - 'cassini-control-panel/**'
      - '.github/workflows/publish-exapp-image.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# Cancel any in-progress run for the same branch when a new push arrives.
# The CUDA build runs on a single self-hosted GPU runner (george) with
# ~90G of disk; back-to-back CUDA builds without this guard pile up
# 11.9G images each and exhaust the LXC's rootfs. main + version tags
# get one concurrency group each so they never cancel each other.
concurrency:
  group: publish-exapp-image-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE: ${{ github.repository_owner }}/gocassini
  # The CPU image is also published as :latest-rocm so ROCm-tagged AppAPI daemons
  # still install — real ROCm support is deferred (sherpa-onnx ships no upstream
  # ROCm artifact). Real CUDA support lands in a follow-up PR with its own
  # Dockerfile.exapp.cuda; until then the -cuda tag is NOT aliased so we do not
  # advertise GPU acceleration we cannot honor.
  EXTRA_ALIAS_SUFFIXES: '-rocm'

jobs:
  validate-manifest:
    name: Validate appinfo/info.xml
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install xmllint
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libxml2-utils
      - name: Wellformed XML check
        run: xmllint --noout appinfo/info.xml
      - name: Required-fields sanity check
        run: |
          set -euo pipefail
          for field in '<id>gocassini</id>' '<external-app>' '<docker-install>' '<routes>'; do
            if ! grep -qF "$field" appinfo/info.xml; then
              echo "appinfo/info.xml missing required marker: $field" >&2
              exit 1
            fi
          done
          # No PUT/POST verbs allowed in <routes> for /enabled or /init —
          # those are AppAPI lifecycle callbacks, not proxied browser routes.
          if grep -qE '<url>\^?/enabled' appinfo/info.xml || grep -qE '<url>\^?/init' appinfo/info.xml; then
            echo "appinfo/info.xml must not declare /enabled or /init under <routes>" >&2
            echo "they are lifecycle callbacks, not browser routes" >&2
            exit 1
          fi

  build-image:
    name: Build ExApp image
    runs-on: ubuntu-latest
    needs: validate-manifest
    outputs:
      image_ref: ${{ steps.meta.outputs.tags }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: meta
        run: |
          set -euo pipefail
          SHA="${GITHUB_SHA::12}"
          REF="${{ env.REGISTRY }}/${{ env.IMAGE }}"
          TAGS=()
          TAGS+=("${REF}:sha-${SHA}")
          case "${GITHUB_EVENT_NAME}" in
            push)
              if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
                VERSION="${GITHUB_REF##refs/tags/}"
                TAGS+=("${REF}:${VERSION}" "${REF}:latest")
                for suffix in ${EXTRA_ALIAS_SUFFIXES}; do
                  TAGS+=("${REF}:${VERSION}${suffix}")
                  TAGS+=("${REF}:latest${suffix}")
                done
              else
                BRANCH="${GITHUB_REF##refs/heads/}"
                # printf (no trailing newline) avoids `tr -c` turning the
                # newline into a trailing hyphen on the tag.
                SAFE_BRANCH="$(printf '%s' "${BRANCH}" | tr '/' '-' | tr -c 'A-Za-z0-9._-' '-')"
                TAGS+=("${REF}:branch-${SAFE_BRANCH}")
                # main + e2e-v3-cpu-gpu both publish :latest. The integration
                # branch is the current "tip of WIP" and supersedes main until
                # it merges; drop it from this list when the merge lands.
                if [[ "${BRANCH}" == "main" || "${BRANCH}" == "e2e-v3-cpu-gpu" ]]; then
                  TAGS+=("${REF}:latest")
                  for suffix in ${EXTRA_ALIAS_SUFFIXES}; do
                    TAGS+=("${REF}:latest${suffix}")
                  done
                fi
              fi
              ;;
            pull_request)
              # PR builds: load locally for the smoke job, do not push.
              ;;
            workflow_dispatch)
              TAGS+=("${REF}:dispatch-$(date -u +%Y%m%d%H%M%S)")
              ;;
          esac
          {
            echo "tags<<EOF"
            for t in "${TAGS[@]}"; do echo "$t"; done
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          # Primary tag used by the smoke job (PR builds use the sha tag too).
          echo "primary=${TAGS[0]}" >> "$GITHUB_OUTPUT"

      # Build always loads the image into the local docker daemon so the
      # downstream smoke/e2e jobs can restore it from a tarball artifact —
      # works uniformly for push, pull_request, and workflow_dispatch
      # events without relying on registry pull from private ghcr.
      - name: Build image (local load)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deployment/Dockerfile.exapp
          platforms: linux/amd64
          push: false
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Push image tags to ghcr (non-PR)
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          while IFS= read -r tag; do
            [[ -z "${tag}" ]] && continue
            echo "Pushing ${tag}"
            docker push "${tag}"
          done <<<"${{ steps.meta.outputs.tags }}"

      - name: Save image tarball
        run: |
          docker save "${{ steps.meta.outputs.primary }}" -o /tmp/exapp-image.tar

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: exapp-image
          path: /tmp/exapp-image.tar
          retention-days: 3

  smoke:
    name: Smoke test image (HTTP plane, dev-mode)
    runs-on: ubuntu-latest
    needs: build-image
    steps:
      - uses: actions/checkout@v4

      - name: Restore image artifact
        uses: actions/download-artifact@v4
        with:
          name: exapp-image
          path: /tmp

      - name: Load image
        run: docker load -i /tmp/exapp-image.tar

      - name: Resolve image ref
        id: ref
        run: |
          set -euo pipefail
          # First tag from build-image is the canonical sha-tagged ref.
          PRIMARY=$(echo "${{ needs.build-image.outputs.image_ref }}" | head -n1)
          echo "ref=${PRIMARY}" >> "$GITHUB_OUTPUT"

      - name: Run smoke test
        env:
          IMAGE_REF: ${{ steps.ref.outputs.ref }}
        run: ./harness/bin/ci-smoke-exapp.sh

  build-image-cuda:
    name: Build CUDA ExApp image (GPU runner)
    runs-on: [self-hosted, Linux, X64, gpu]
    needs: validate-manifest
    outputs:
      image_ref: ${{ steps.meta.outputs.tags }}
      primary:   ${{ steps.meta.outputs.primary }}
      digest:    ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      # The CUDA build produces a ~12G image. Self-hosted runner disk has a
      # 90G rootfs; three back-to-back builds without housekeeping fill it.
      # Reclaim aggressively before each build so a single previous run
      # never blocks the next: drop everything except images younger than
      # 30 min (the in-flight build's parents) + the active buildx cache.
      - name: Free disk on self-hosted runner
        run: |
          df -h / | head -3
          docker image prune -af --filter "until=30m" 2>&1 | tail -3 || true
          docker buildx prune -af --filter "until=24h" 2>&1 | tail -3 || true
          df -h / | head -3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute CUDA image tags
        id: meta
        run: |
          set -euo pipefail
          SHA="${GITHUB_SHA::12}"
          REF="${{ env.REGISTRY }}/${{ env.IMAGE }}"
          TAGS=()
          TAGS+=("${REF}:sha-${SHA}-cuda")
          case "${GITHUB_EVENT_NAME}" in
            push)
              if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
                VERSION="${GITHUB_REF##refs/tags/}"
                TAGS+=("${REF}:${VERSION}-cuda" "${REF}:latest-cuda" "${REF}:cuda")
              else
                BRANCH="${GITHUB_REF##refs/heads/}"
                SAFE_BRANCH="$(printf '%s' "${BRANCH}" | tr '/' '-' | tr -c 'A-Za-z0-9._-' '-')"
                TAGS+=("${REF}:branch-${SAFE_BRANCH}-cuda")
                # main + e2e-v3-cpu-gpu both publish :latest-cuda. Drop the
                # integration branch from this list when the merge lands.
                if [[ "${BRANCH}" == "main" || "${BRANCH}" == "e2e-v3-cpu-gpu" ]]; then
                  TAGS+=("${REF}:latest-cuda" "${REF}:cuda")
                fi
              fi
              ;;
            pull_request) ;;
            workflow_dispatch)
              TAGS+=("${REF}:dispatch-$(date -u +%Y%m%d%H%M%S)-cuda")
              ;;
          esac
          {
            echo "tags<<EOF"
            for t in "${TAGS[@]}"; do echo "$t"; done
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "primary=${TAGS[0]}" >> "$GITHUB_OUTPUT"

      # The CUDA image is ~5 GiB (fp32 model + cuDNN runtime + CUDA EP), large
      # enough that the type=gha cache backend can become unreliable. Keep the
      # build local-load + tarball-via-artifact pattern matches the CPU job;
      # type=registry cache could be added later if cold-build time becomes a
      # real pain on the GPU runner.
      - name: Build CUDA image (local load)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deployment/Dockerfile.exapp.cuda
          platforms: linux/amd64
          push: false
          load: true
          tags: ${{ steps.meta.outputs.tags }}

      - name: Push CUDA tags to ghcr (non-PR)
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          while IFS= read -r tag; do
            [[ -z "${tag}" ]] && continue
            echo "Pushing ${tag}"
            docker push "${tag}"
          done <<<"${{ steps.meta.outputs.tags }}"

      - name: Save image tarball
        run: docker save "${{ steps.meta.outputs.primary }}" -o /tmp/exapp-cuda-image.tar

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: exapp-cuda-image
          path: /tmp/exapp-cuda-image.tar
          retention-days: 3

  transcribe-smoke-cuda:
    name: Smoke transcription on GPU (bundled fp32 model + CUDA EP)
    runs-on: [self-hosted, Linux, X64, gpu]
    needs: build-image-cuda
    steps:
      - uses: actions/checkout@v4

      - name: Resolve image ref
        id: ref
        run: |
          set -euo pipefail
          # build-image-cuda built locally and pushed if non-PR; the tarball
          # was also uploaded for cross-job reuse but we're on the same
          # runner so the image is already in the local daemon.
          PRIMARY="${{ needs.build-image-cuda.outputs.primary }}"
          echo "ref=${PRIMARY}" >> "$GITHUB_OUTPUT"

      - name: Run CUDA transcribe smoke
        env:
          IMAGE_REF: ${{ steps.ref.outputs.ref }}
        run: ./harness/bin/ci-transcribe-smoke-exapp.sh

      - name: Run dual-variant transcript verify (CUDA = v3 fp32)
        env:
          IMAGE_REF: ${{ steps.ref.outputs.ref }}
          # Empirically on this clip fp32 (CUDA) lands at ratio 0.6565 —
          # essentially identical to int8 (CPU at 0.6391). The first ~6s of
          # the LibriSpeech clip is dropped by sherpa-onnx's streaming VAD
          # regardless of model precision; fp32 doesn't recover those words.
          # Smoke floor catches "loaded but gibberish" without gating WER.
          # Tracked: investigate sherpa-onnx VAD softness on Parakeet v3.
          MIN_LEVENSHTEIN: "0.50"
        run: ./harness/bin/ci-e2e-v3-transcript-verify.sh

  transcribe-smoke:
    name: Smoke transcription (bundled model, no download)
    runs-on: ubuntu-latest
    needs: build-image
    steps:
      - uses: actions/checkout@v4

      - name: Restore image artifact
        uses: actions/download-artifact@v4
        with:
          name: exapp-image
          path: /tmp

      - name: Load image
        run: docker load -i /tmp/exapp-image.tar

      - name: Resolve image ref
        id: ref
        run: |
          set -euo pipefail
          PRIMARY=$(echo "${{ needs.build-image.outputs.image_ref }}" | head -n1)
          echo "ref=${PRIMARY}" >> "$GITHUB_OUTPUT"

      - name: Run transcribe smoke
        env:
          IMAGE_REF: ${{ steps.ref.outputs.ref }}
        run: ./harness/bin/ci-transcribe-smoke-exapp.sh

      - name: Run dual-variant transcript verify (CPU = v3 int8)
        env:
          IMAGE_REF: ${{ steps.ref.outputs.ref }}
          # v3 int8 (CPU) drops the soft opening on this clip — sherpa-onnx's
          # streaming VAD does not pick up the early words. The threshold is
          # a smoke floor that catches "model loaded but produced gibberish"
          # without gating on absolute WER. Investigation tracked separately.
          MIN_LEVENSHTEIN: "0.50"
        run: ./harness/bin/ci-e2e-v3-transcript-verify.sh

  e2e-container:
    name: E2E container HTTP plane + middleware + lifecycle (no Nextcloud)
    runs-on: ubuntu-latest
    needs: build-image
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Restore image artifact
        uses: actions/download-artifact@v4
        with:
          name: exapp-image
          path: /tmp

      - name: Load image
        run: docker load -i /tmp/exapp-image.tar

      - name: Resolve image ref
        id: ref
        run: |
          PRIMARY=$(echo "${{ needs.build-image.outputs.image_ref }}" | head -n1)
          echo "ref=${PRIMARY}" >> "$GITHUB_OUTPUT"

      - name: Run container-level e2e
        env:
          IMAGE_REF: ${{ steps.ref.outputs.ref }}
        run: ./harness/bin/ci-e2e-exapp.sh

  e2e-install:
    name: E2E install against real Nextcloud + AppAPI
    runs-on: ubuntu-latest
    needs: build-image
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Restore image artifact
        uses: actions/download-artifact@v4
        with:
          name: exapp-image
          path: /tmp

      - name: Load image
        run: docker load -i /tmp/exapp-image.tar

      - name: Resolve image ref
        id: ref
        run: |
          PRIMARY=$(echo "${{ needs.build-image.outputs.image_ref }}" | head -n1)
          echo "ref=${PRIMARY}" >> "$GITHUB_OUTPUT"

      - name: Run install e2e against a fresh Nextcloud + AppAPI
        env:
          IMAGE_REF: ${{ steps.ref.outputs.ref }}
        run: ./harness/bin/ci-e2e-install-exapp.sh

  prune-old-versions:
    name: Prune old sha-tagged image versions
    runs-on: ubuntu-latest
    needs:
      - build-image
      - build-image-cuda
      - smoke
      - transcribe-smoke
      - transcribe-smoke-cuda
      - e2e-container
      - e2e-install
    # Only prune after a successful push that actually pushed to ghcr — any
    # of the branches that publish :latest (main + the integration WIP) plus
    # version tags.
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/e2e-v3-cpu-gpu' || startsWith(github.ref, 'refs/tags/'))
    permissions:
      packages: write
    steps:
      # For container packages, the GitHub API returns sha256 digests in
      # `name` and the actual tags in `metadata.container.tags`. The
      # delete-package-versions action's `ignore-versions` regex matches
      # against `name` (the digest), which is useless here. Use a bash
      # script that inspects tags explicitly: keep every version that
      # carries a named tag (latest, latest-cuda, latest-rocm, v*); from
      # the remainder (sha-*-only versions), keep the 10 newest and
      # delete the rest.
      - name: Prune
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          PACKAGE: gocassini
          KEEP: 10
        run: |
          set -euo pipefail
          tmp=$(mktemp -d)
          trap 'rm -rf "$tmp"' EXIT

          # Fetch every version of the container package.
          gh api --paginate \
            -H "Accept: application/vnd.github+json" \
            "/orgs/${OWNER}/packages/container/${PACKAGE}/versions" \
            > "$tmp/versions.json"

          # Versions worth keeping outright (any named tag). `latest-cuda` stays
          # in the keep-list so PR #32's real CUDA image is protected once it
          # starts being published; for now nothing pushes that tag.
          jq -r '
            .[]
            | .metadata.container.tags as $tags
            | select(
                ($tags | any(. == "latest" or . == "latest-cuda" or . == "latest-rocm" or startswith("v")))
              )
            | "KEEP \(.id) tags=\($tags | join(","))"
          ' "$tmp/versions.json" | tee "$tmp/keep.log" || true

          # Candidate versions for pruning: tagged only with sha-* (or untagged).
          # Sort newest -> oldest, skip the first $KEEP, delete the rest.
          jq -r '
            sort_by(.created_at) | reverse
            | .[]
            | .metadata.container.tags as $tags
            | select(
                ($tags | any(. == "latest" or . == "latest-cuda" or . == "latest-rocm" or startswith("v"))) | not
              )
            | "\(.id)\t\(.created_at)\t\($tags | join(","))"
          ' "$tmp/versions.json" > "$tmp/candidates.tsv"

          total=$(wc -l < "$tmp/candidates.tsv")
          echo "Found ${total} sha-only / untagged versions; will keep newest ${KEEP}"

          if [[ "${total}" -le "${KEEP}" ]]; then
            echo "Nothing to prune."
            exit 0
          fi

          tail -n +$((KEEP + 1)) "$tmp/candidates.tsv" | while IFS=$'\t' read -r id created tags; do
            echo "DELETE id=${id} created=${created} tags=${tags}"
            gh api -X DELETE \
              -H "Accept: application/vnd.github+json" \
              "/orgs/${OWNER}/packages/container/${PACKAGE}/versions/${id}"
          done
