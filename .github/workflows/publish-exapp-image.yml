name: Build + publish ExApp image

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    # Adding the `full-ci` label re-triggers optional CUDA/quality tiers.
    # The classifier below keeps docs-only PRs cheap while still emitting the
    # required faithful-check context instead of leaving path-filtered checks
    # permanently pending in branch protection.
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# Cancel any in-progress run for the same branch when a new push arrives.
# Pushes to main and to each version tag get their own concurrency group,
# so a tag publish never cancels a main publish and vice-versa.
concurrency:
  group: publish-exapp-image-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE: ${{ github.repository_owner }}/gocassini
  # The CPU image is also aliased with these suffixes (:latest-rocm,
  # :X.Y.Z-rocm) so ROCm-tagged AppAPI daemons still install — real ROCm
  # support is deferred (sherpa-onnx ships no upstream ROCm artifact).
  # -cuda tags are NOT aliases of the CPU image: they come from the
  # dedicated CUDA build (build-image-cuda below).
  EXTRA_ALIAS_SUFFIXES: '-rocm'

jobs:
  classify-changes:
    name: Classify image and harness relevance
    runs-on: ubuntu-latest
    outputs:
      relevant: ${{ steps.changes.outputs.relevant }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Classify changed paths
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          relevant=true
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            # Fail closed: if the diff can't be computed, classify as relevant so
            # the required faithful gate actually runs instead of auto-passing green.
            if ! changed="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"; then
              echo "::warning::git diff failed; classifying change as relevant (fail-closed)"
              echo "relevant=true" | tee -a "$GITHUB_OUTPUT"
              exit 0
            fi
            # Deny-list classifier (D-505): relevant unless EVERY changed path is
            # provably docs/notes/assets. The predicate, its ci.yml-mirrored
            # deny-list, and the load-bearing empty-path guard live in the script
            # so they stay unit-tested offline (scripts/test-classify-image-relevance.sh)
            # rather than resting on review-by-eye. There is no product allow-list
            # here anymore: an un-enumerated build input classifies relevant by
            # default, wasting runner minutes at worst instead of greening a
            # required check on an unbuilt product. Two-dot diff is deliberate --
            # it over-reports, biasing toward relevant=true (the fail-safe side).
            relevant="$(printf '%s\n' "$changed" | "$GITHUB_WORKSPACE/scripts/classify-image-relevance.sh")"
          fi
          echo "relevant=$relevant" | tee -a "$GITHUB_OUTPUT"

  validate-manifest:
    name: Validate appinfo/info.xml
    runs-on: ubuntu-latest
    needs: classify-changes
    if: needs.classify-changes.outputs.relevant == 'true'
    outputs:
      # <version> from appinfo/info.xml — the single source of truth for
      # release image tags (:X.Y.Z, :X.Y.Z-cuda).
      app_version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Install xmllint
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libxml2-utils
      - name: Wellformed XML check
        run: xmllint --noout appinfo/info.xml
      - name: Required-fields sanity check
        run: |
          set -euo pipefail
          # The two Talk secret declarations are markers, not decoration: AppAPI
          # only injects env keys the manifest declares (D-403), so deleting
          # either <variable> silently disables Talk recording. Grepping for them
          # here puts that exact regression class on a per-PR REQUIRED context in
          # seconds — the cheap tier under the on-demand D-403 sensitivity control
          # (harness/bin/ci-e2e-installed-exapp-talk.sh).
          for field in \
            '<id>gocassini</id>' '<external-app>' '<docker-install>' '<routes>' \
            '<name>CASSINI_TALK_RECORDING_SECRET</name>' \
            '<name>CASSINI_TALK_SIGNALING_INTERNAL_SECRET</name>' \
            '<name>CASSINI_PUBLISH_SINK</name>'; do
            if ! grep -qF "$field" appinfo/info.xml; then
              echo "appinfo/info.xml missing required marker: $field" >&2
              exit 1
            fi
          done
          # No PUT/POST verbs allowed in <routes> for /enabled or /init —
          # those are AppAPI lifecycle callbacks, not proxied browser routes.
          if grep -qE '<url>\^?/enabled' appinfo/info.xml || grep -qE '<url>\^?/init' appinfo/info.xml; then
            echo "appinfo/info.xml must not declare /enabled or /init under <routes>" >&2
            echo "they are lifecycle callbacks, not browser routes" >&2
            exit 1
          fi
      - name: Version pin consistency check
        id: version
        run: |
          set -euo pipefail
          VERSION="$(xmllint --xpath 'string(/info/version)' appinfo/info.xml)"
          IMAGE_TAG="$(xmllint --xpath 'string(/info/external-app/docker-install/image-tag)' appinfo/info.xml)"
          echo "info.xml version=${VERSION} image-tag=${IMAGE_TAG}"
          # X.Y.Z with an optional semver pre-release suffix (-alpha.1, …),
          # matching the App Store info.xsd `semver` type: the store treats
          # suffixed versions as pre-releases.
          if [[ ! "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
            echo "appinfo/info.xml <version> must be X.Y.Z or X.Y.Z-<prerelease>, got: '${VERSION}'" >&2
            exit 1
          fi
          # Reproducible installs (D-360): the manifest must pin the image to
          # the release version, never a floating tag like latest — a
          # reinstall must pull the exact build the app version was cut from.
          if [[ "${IMAGE_TAG}" != "${VERSION}" ]]; then
            echo "appinfo/info.xml <image-tag> (${IMAGE_TAG}) must equal <version> (${VERSION})" >&2
            echo "run scripts/bump-exapp-version.sh <version> to bump both together" >&2
            exit 1
          fi
          # A release tag must match the manifest it ships: tagging v0.2.0
          # with info.xml still at 0.1.0 would publish image tags that
          # contradict the app version AppAPI registers.
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF##refs/tags/}"
            if [[ "${TAG}" != "v${VERSION}" ]]; then
              echo "git tag ${TAG} does not match appinfo/info.xml <version> ${VERSION} (expected v${VERSION})" >&2
              echo "run scripts/bump-exapp-version.sh before tagging a release" >&2
              exit 1
            fi
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

  build-image:
    name: Build ExApp image
    runs-on: ubuntu-latest
    needs: [classify-changes, validate-manifest]
    outputs:
      image_ref: ${{ steps.meta.outputs.tags }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: meta
        run: |
          set -euo pipefail
          SHA="${GITHUB_SHA::12}"
          REF="${{ env.REGISTRY }}/${{ env.IMAGE }}"
          TAGS=()
          TAGS+=("${REF}:sha-${SHA}")
          case "${GITHUB_EVENT_NAME}" in
            push)
              if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
                # Release tags come from appinfo/info.xml <version>, not the
                # git ref: validate-manifest guarantees the git tag is
                # v<version> and that <image-tag> matches, so the published
                # :X.Y.Z tag is exactly what a pinned AppAPI install pulls.
                VERSION="${{ needs.validate-manifest.outputs.app_version }}"
                TAGS+=("${REF}:${VERSION}" "${REF}:latest")
                for suffix in ${EXTRA_ALIAS_SUFFIXES}; do
                  TAGS+=("${REF}:${VERSION}${suffix}")
                  TAGS+=("${REF}:latest${suffix}")
                done
              else
                BRANCH="${GITHUB_REF##refs/heads/}"
                # printf (no trailing newline) avoids `tr -c` turning the
                # newline into a trailing hyphen on the tag.
                SAFE_BRANCH="$(printf '%s' "${BRANCH}" | tr '/' '-' | tr -c 'A-Za-z0-9._-' '-')"
                TAGS+=("${REF}:branch-${SAFE_BRANCH}")
                if [[ "${BRANCH}" == "main" ]]; then
                  TAGS+=("${REF}:latest")
                  for suffix in ${EXTRA_ALIAS_SUFFIXES}; do
                    TAGS+=("${REF}:latest${suffix}")
                  done
                fi
              fi
              ;;
            pull_request)
              # PR builds: load locally for the smoke job, do not push.
              ;;
            workflow_dispatch)
              TAGS+=("${REF}:dispatch-$(date -u +%Y%m%d%H%M%S)")
              ;;
          esac
          {
            echo "tags<<EOF"
            for t in "${TAGS[@]}"; do echo "$t"; done
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          # Primary tag used by the smoke job (PR builds use the sha tag too).
          echo "primary=${TAGS[0]}" >> "$GITHUB_OUTPUT"

      # Build always loads the image into the local docker daemon so the
      # downstream smoke/e2e jobs can restore it from a tarball artifact —
      # works uniformly for push, pull_request, and workflow_dispatch
      # events without relying on registry pull from private ghcr.
      - name: Build image (local load)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deployment/Dockerfile.exapp
          platforms: linux/amd64
          push: false
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Push image tags to ghcr (non-PR)
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          while IFS= read -r tag; do
            [[ -z "${tag}" ]] && continue
            echo "Pushing ${tag}"
            docker push "${tag}"
          done <<<"${{ steps.meta.outputs.tags }}"

      # PR builds can't reach ghcr (push step is skipped), so they still
      # need the artifact-based handoff. Push builds skip the artifact —
      # GitHub's per-org artifact storage quota is small enough that two
      # CUDA images (~4.7 GiB each) saturate it within a single business
      # day, and on push the image is already at ghcr.io for any
      # downstream job to docker pull.
      - name: Save image tarball
        if: github.event_name == 'pull_request'
        run: |
          docker save "${{ steps.meta.outputs.primary }}" -o /tmp/exapp-image.tar

      - name: Upload image artifact
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: exapp-image
          path: /tmp/exapp-image.tar
          retention-days: 1
          if-no-files-found: ignore

  faithful-installed-exapp-talk-cpu:
    name: Faithful installed ExApp Talk artifact (CPU)
    runs-on: ubuntu-latest
    needs: [classify-changes, build-image]
    timeout-minutes: 30
    # Required product gate: one no-retry AppAPI/HaRP-installed Talk recording.
    # Relevant PRs and every main push execute the product path. Unrelated PRs
    # emit an explicit not-applicable success so branch protection never waits on
    # a skipped path-filtered workflow.
    if: always()
    steps:
      - name: Fail if change classification is unavailable
        if: needs.classify-changes.result != 'success'
        run: |
          echo "::error::change classifier result was ${{ needs.classify-changes.result }}" >&2
          exit 1

      - name: Fail if the exact image build is unavailable
        if: >-
          needs.classify-changes.outputs.relevant == 'true' &&
          needs.build-image.result != 'success'
        run: |
          echo "::error::exact image build result was ${{ needs.build-image.result }}" >&2
          exit 1

      - name: Mark unrelated change as not applicable
        if: needs.classify-changes.outputs.relevant != 'true'
        run: echo 'Faithful installed-ExApp gate is not applicable; no image, product, CLI, workflow, or harness input changed.'

      - uses: actions/checkout@v4
        if: needs.classify-changes.outputs.relevant == 'true'

      - uses: actions/setup-go@v5
        if: needs.classify-changes.outputs.relevant == 'true'
        with:
          go-version: '1.22'

      - name: Install host validation tools
        if: needs.classify-changes.outputs.relevant == 'true'
        run: |
          sudo apt-get update
          # ffmpeg supplies both ffmpeg and ffprobe. The host-side portable
          # artifact validator needs them for `cassini inspect --transcript`.
          sudo apt-get install -y --no-install-recommends ffmpeg jq libxml2-utils
          git lfs version

      - name: Materialize only the known audible participant fixture
        if: needs.classify-changes.outputs.relevant == 'true'
        run: >-
          git lfs pull
          --include="harness/media/processed/showcase-lantern-festival-v1/mira.ivf,harness/media/processed/showcase-lantern-festival-v1/mira.ogg"

      - name: Verify participant fixture is materialized
        if: needs.classify-changes.outputs.relevant == 'true'
        run: |
          set -euo pipefail
          prefix=harness/media/processed/showcase-lantern-festival-v1/mira
          for media in "$prefix.ivf" "$prefix.ogg"; do
            [[ -s "$media" && $(stat -c%s "$media") -gt 10000 ]] || {
              echo "::error::known participant media missing or still an LFS pointer: $media" >&2
              exit 1
            }
          done

      - name: Load exact ExApp image
        if: needs.classify-changes.outputs.relevant == 'true'
        id: load
        uses: ./.github/actions/load-exapp-image
        with:
          image-ref-list: ${{ needs.build-image.outputs.image_ref }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Pre-pull stack images
        if: needs.classify-changes.outputs.relevant == 'true'
        run: docker compose -f harness/compose.yml --profile full pull

      - name: Run one faithful AppAPI/HaRP-installed Talk recording
        if: needs.classify-changes.outputs.relevant == 'true'
        env:
          IMAGE_REF: ${{ steps.load.outputs.ref }}
          LOG_DIR: ${{ runner.temp }}/faithful-installed-exapp-talk-cpu
        run: ./harness/bin/ci-e2e-installed-exapp-talk.sh

      - name: Upload faithful check evidence
        if: always() && needs.classify-changes.outputs.relevant == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: faithful-installed-exapp-talk-cpu-${{ github.run_attempt }}
          path: ${{ runner.temp }}/faithful-installed-exapp-talk-cpu
          if-no-files-found: warn
          retention-days: 14

  d403-manifest-sensitivity-control:
    # The NEGATIVE control for the faithful gate above: it runs the exact same
    # orchestrator against a manifest with the CASSINI_TALK_SIGNALING_INTERNAL_SECRET
    # declaration stripped, and proves the installed ExApp reports the signaling
    # secret unconfigured and fails before recording — the D-403 boundary
    # (AppAPI drops env keys the manifest does not declare), machine-checked.
    #
    # DELIBERATELY off the per-PR required path (workflow_dispatch only): a
    # DISTINCT job id and check name from "Faithful installed ExApp Talk artifact
    # (CPU)" so it can never be mistaken for that required context. Trigger it by
    # hand from the Actions tab ("Run workflow"). The cheap, always-on tiers that
    # ride under it are the required-fields marker lint in validate-manifest above
    # and harness/bin/test-negative-manifest.sh in ci.yml's contracts job.
    name: D-403 manifest allow-list sensitivity control (CPU)
    runs-on: ubuntu-latest
    needs: [classify-changes, build-image]
    if: github.event_name == 'workflow_dispatch'
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Install host validation tools
        run: |
          sudo apt-get update
          # ffmpeg supplies both ffmpeg and ffprobe, which the orchestrator
          # preflights before stack up (a contract enforced by
          # test-faithful-host-tools.sh) even on the control path.
          sudo apt-get install -y --no-install-recommends ffmpeg jq libxml2-utils
          git lfs version

      - name: Materialize only the known audible participant fixture
        run: >-
          git lfs pull
          --include="harness/media/processed/showcase-lantern-festival-v1/mira.ivf,harness/media/processed/showcase-lantern-festival-v1/mira.ogg"

      - name: Verify participant fixture is materialized
        run: |
          set -euo pipefail
          prefix=harness/media/processed/showcase-lantern-festival-v1/mira
          for media in "$prefix.ivf" "$prefix.ogg"; do
            [[ -s "$media" && $(stat -c%s "$media") -gt 10000 ]] || {
              echo "::error::known participant media missing or still an LFS pointer: $media" >&2
              exit 1
            }
          done

      - name: Load exact ExApp image
        id: load
        uses: ./.github/actions/load-exapp-image
        with:
          image-ref-list: ${{ needs.build-image.outputs.image_ref }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Pre-pull stack images
        run: docker compose -f harness/compose.yml --profile full pull

      - name: Generate signaling-secret-free manifest
        run: |
          set -euo pipefail
          python3 harness/bin/make-negative-manifest.py \
            appinfo/info.xml "$RUNNER_TEMP/info-no-signaling.xml"

      - name: Run the D-403 sensitivity control (expect failure before recording)
        env:
          IMAGE_REF: ${{ steps.load.outputs.ref }}
          D453_EXPECT_CONFIG_FAILURE: '1'
          D453_MANIFEST_PATH: ${{ runner.temp }}/info-no-signaling.xml
          LOG_DIR: ${{ runner.temp }}/d403-sensitivity-control
        run: ./harness/bin/ci-e2e-installed-exapp-talk.sh

      - name: Assert the control tripped at the boundary, before recording
        run: |
          set -euo pipefail
          summary="$RUNNER_TEMP/d403-sensitivity-control/summary.json"
          [[ -f "$summary" ]] || { echo "::error::no summary.json at $summary" >&2; exit 1; }
          # The ticket's Done-when, machine-checked from the retained evidence:
          # the installed status reported the signaling secret UNCONFIGURED, the
          # differential control fired at stack verification, and no recording was
          # attempted (recording_performed is a fact about the run, not a branch
          # constant — see ci-e2e-installed-exapp-talk.sh RECORDING_ATTEMPTED).
          jq -e '
            .result == "sensitivity-control-passed"
            and .control.expected == true
            and .control.signaling_internal_secret_configured == false
            and .control.recording_performed == false
            and .control.branch == "stack-verification"
          ' "$summary"

      - name: Upload D-403 sensitivity control evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: d403-sensitivity-control-${{ github.run_attempt }}
          path: ${{ runner.temp }}/d403-sensitivity-control
          if-no-files-found: warn
          retention-days: 14

  smoke:
    name: Smoke test image (HTTP plane, dev-mode)
    runs-on: ubuntu-latest
    needs: build-image
    steps:
      - uses: actions/checkout@v4

      - name: Load ExApp image
        id: load
        uses: ./.github/actions/load-exapp-image
        with:
          image-ref-list: ${{ needs.build-image.outputs.image_ref }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run smoke test
        env:
          IMAGE_REF: ${{ steps.load.outputs.ref }}
        run: ./harness/bin/ci-smoke-exapp.sh

  build-cuda-base:
    name: Build CUDA base image (model + CUDA libs)
    # The fat, slow-changing substrate (~2.3GB fp32 model + CUDA native libs +
    # nvidia runtime + apt) lives in a separate image tagged by a content hash
    # of its inputs. Build+push it only when that exact hash is absent from
    # ghcr, so an unchanged base is never rebuilt or re-downloaded; the
    # per-commit CUDA app build reuses it via FROM (D-375). Stays on
    # ubuntu-latest — no GPU needed, keeps george free.
    runs-on: ubuntu-latest
    needs: validate-manifest
    # Heavy tier: builds on push/dispatch, or on a PR explicitly labeled
    # `full-ci`. The same-repo clause keeps the CUDA chain (which feeds the
    # self-hosted GPU jobs) off fork PRs; pushing the base also needs ghcr creds.
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       contains(github.event.pull_request.labels.*.name, 'full-ci'))
    outputs:
      base_ref: ${{ steps.base.outputs.base_ref }}
    steps:
      - uses: actions/checkout@v4

      - name: Free disk on ubuntu-latest
        run: |
          set -euo pipefail
          sudo rm -rf \
            /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
            /usr/local/share/powershell /usr/share/swift
          sudo docker image prune -af 2>&1 | tail -1 || true
          df -h / | head -2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve base ref + check existence
        id: base
        # The hash covers every input that defines the base's bytes: the asset
        # URLs (read from the base Dockerfile's ARG defaults — single source of
        # truth), a best-effort content fingerprint of each (so an in-place
        # overwrite of a non-versioned URL still moves the hash), the resolved
        # nvidia base digest (catches silent upstream re-pushes), and the base
        # Dockerfile's own bytes. No timestamps/random — fully reproducible.
        run: |
          set -euo pipefail
          DF=deployment/Dockerfile.exapp.cuda.base
          APP_DF=deployment/Dockerfile.exapp.cuda
          # Read an ARG default from a Dockerfile, failing loudly if the line is
          # absent or empty — a renamed ARG must not silently yield a wrong hash.
          df_get() {
            local v
            v="$(grep -E "^ARG $2=" "$1" | head -1 | sed "s/^ARG $2=//")" \
              || { echo "ARG $2 not found in $1" >&2; exit 1; }
            test -n "$v" || { echo "ARG $2 empty in $1" >&2; exit 1; }
            printf '%s' "$v"
          }
          MODEL_ID="$(df_get "$DF" CASSINI_BUNDLED_MODEL_ID)"
          MODEL_URL="$(df_get "$DF" CASSINI_BUNDLED_MODEL_URL)"
          SHERPA_URL="$(df_get "$DF" SHERPA_CUDA_URL)"
          VAD_URL="$(df_get "$DF" SILERO_VAD_URL)"

          # The app Dockerfile independently sets CASSINI_STT_MODEL from its own
          # CASSINI_BUNDLED_MODEL_ID. If it drifts from the base's, the runtime
          # points at a model dir the base never baked — a model-less image that
          # builds green and fails at first transcribe. Enforce equality.
          APP_MODEL_ID="$(df_get "$APP_DF" CASSINI_BUNDLED_MODEL_ID)"
          if [ "$MODEL_ID" != "$APP_MODEL_ID" ]; then
            echo "CASSINI_BUNDLED_MODEL_ID mismatch: base=$MODEL_ID app=$APP_MODEL_ID" >&2
            exit 1
          fi

          # Pin the nvidia base by digest (catches silent upstream re-pushes).
          # Retry: Docker Hub anonymous manifest reads occasionally rate-limit.
          NV_REF="nvidia/cuda:12.4.1-cudnn-runtime-ubuntu22.04"
          NV_DIGEST=""
          for attempt in 1 2 3; do
            if NV_DIGEST="$(docker buildx imagetools inspect "$NV_REF" --format '{{json .Manifest.Digest}}' | tr -d '"')" \
               && [ -n "$NV_DIGEST" ]; then
              break
            fi
            echo "nvidia digest resolve attempt ${attempt} failed; retrying" >&2
            sleep 5
          done
          test -n "$NV_DIGEST" || { echo "could not resolve ${NV_REF} digest" >&2; exit 1; }

          fp() { curl -fsSL -I "$1" 2>/dev/null | tr -d '\r' \
                 | awk -F': ' 'tolower($1)=="etag"||tolower($1)=="last-modified"{print $2; exit}' || true; }

          BASE_HASH="$(printf '%s\n' \
            "$MODEL_ID" "$MODEL_URL" "$(fp "$MODEL_URL")" \
            "$SHERPA_URL" "$(fp "$SHERPA_URL")" \
            "$VAD_URL" "$(fp "$VAD_URL")" \
            "$NV_DIGEST" \
            "$(sha256sum "$DF" | cut -d' ' -f1)" \
            | sha256sum | cut -c1-16)"
          BASE_REF="${{ env.REGISTRY }}/${{ github.repository_owner }}/gocassini-cuda-base:${BASE_HASH}"
          echo "base_ref=${BASE_REF}" >> "$GITHUB_OUTPUT"
          echo "Base ref: ${BASE_REF}"

          if docker buildx imagetools inspect "$BASE_REF" >/dev/null 2>&1; then
            echo "Base already present in registry — no rebuild, no re-download."
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "Base absent — will build and push once."
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build + push base image
        if: steps.base.outputs.build == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deployment/Dockerfile.exapp.cuda.base
          platforms: linux/amd64
          push: true
          tags: ${{ steps.base.outputs.base_ref }}

  build-image-cuda:
    name: Build CUDA ExApp image
    # CUDA Docker builds do not touch the GPU — they're just layer assembly.
    # Running on ubuntu-latest frees the single self-hosted GPU runner for
    # jobs that actually need it (transcribe-smoke-cuda, e2e-talk-record-cuda,
    # deploy-preview's deploy-gpu). Only the thin per-commit layers build here;
    # the fat base comes prebuilt from build-cuda-base via FROM (D-375).
    runs-on: ubuntu-latest
    needs: [validate-manifest, build-cuda-base]
    # Heavy tier: builds on push/dispatch, or on a PR explicitly labeled
    # `full-ci`. Fork PRs cannot push to ghcr and must never run downstream CUDA
    # jobs on the self-hosted GPU runner, so the same-repo clause stays.
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       contains(github.event.pull_request.labels.*.name, 'full-ci'))
    outputs:
      image_ref: ${{ steps.meta.outputs.tags }}
      primary:   ${{ steps.meta.outputs.primary }}
      digest:    ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      # The CUDA image is ~5 GiB and the build needs additional scratch space
      # for layers and the buildx cache. ubuntu-latest ships with ~14 GiB free
      # by default; reclaim ~30 GiB by removing preinstalled toolchains we
      # don't use (Android SDK, .NET, Haskell, CodeQL).
      - name: Free disk on ubuntu-latest
        run: |
          set -euo pipefail
          df -h / | head -3
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL \
            /usr/local/share/boost \
            /usr/local/share/powershell \
            /usr/share/swift
          sudo docker image prune -af 2>&1 | tail -2 || true
          df -h / | head -3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute CUDA image tags
        id: meta
        run: |
          set -euo pipefail
          SHA="${GITHUB_SHA::12}"
          REF="${{ env.REGISTRY }}/${{ env.IMAGE }}"
          TAGS=()
          TAGS+=("${REF}:sha-${SHA}-cuda")
          case "${GITHUB_EVENT_NAME}" in
            push)
              if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
                # Same source of truth as the CPU build: appinfo/info.xml
                # <version>, validated against the git tag upstream.
                VERSION="${{ needs.validate-manifest.outputs.app_version }}"
                TAGS+=("${REF}:${VERSION}-cuda" "${REF}:latest-cuda" "${REF}:cuda")
              else
                BRANCH="${GITHUB_REF##refs/heads/}"
                SAFE_BRANCH="$(printf '%s' "${BRANCH}" | tr '/' '-' | tr -c 'A-Za-z0-9._-' '-')"
                TAGS+=("${REF}:branch-${SAFE_BRANCH}-cuda")
                if [[ "${BRANCH}" == "main" ]]; then
                  TAGS+=("${REF}:latest-cuda" "${REF}:cuda")
                fi
              fi
              ;;
            pull_request) ;;
            workflow_dispatch)
              TAGS+=("${REF}:dispatch-$(date -u +%Y%m%d%H%M%S)-cuda")
              ;;
          esac
          {
            echo "tags<<EOF"
            for t in "${TAGS[@]}"; do echo "$t"; done
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "primary=${TAGS[0]}" >> "$GITHUB_OUTPUT"

      # Build + push in one step. push: true is safe for same-repo PRs
      # (job-level if: guarantees we are not running on a fork PR) and lets
      # the downstream CUDA jobs docker-pull from ghcr. FROM the prebuilt base
      # (D-375): only the thin per-commit layers build here; the 2.3GB model +
      # CUDA libs come from build-cuda-base, so an unchanged base is neither
      # re-downloaded from origin nor re-extracted. Registry cache (on ghcr)
      # replaces the flaky type=gha export (the "error writing layer blob:
      # not_found" seen on PR #59); PRs read the cache, only pushes write it.
      - name: Build and push CUDA image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deployment/Dockerfile.exapp.cuda
          platforms: linux/amd64
          push: true
          # Push a plain single manifest, exactly like the CPU/ROCm tags
          # (which are `docker push`ed after a local load). With buildx
          # defaults, `push: true` emits an OCI *index* wrapping the amd64
          # manifest plus an unknown/unknown provenance attestation. Both
          # children are UNTAGGED, so the Prune job below — which keeps
          # versions by tag — deleted them and left every -cuda tag pointing
          # at a missing manifest ("not found" on docker pull). Single-arch
          # image, no attestation consumers: no reason to publish an index.
          provenance: false
          sbom: false
          build-args: |
            BASE_IMAGE=${{ needs.build-cuda-base.outputs.base_ref }}
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE }}-buildcache:cuda
          cache-to: ${{ github.event_name != 'pull_request' && format('type=registry,ref={0}/{1}-buildcache:cuda,mode=max', env.REGISTRY, env.IMAGE) || '' }}

  transcribe-smoke-cuda:
    name: Smoke transcription on GPU (bundled fp32 model + CUDA EP)
    runs-on: [self-hosted, Linux, X64, gpu]
    needs: build-image-cuda
    # Heavy tier (self-hosted GPU): push/dispatch, or a same-repo PR labeled
    # `full-ci`. Mirrors the build-image-cuda guard as defense-in-depth so a
    # future graph change can't expose the GPU runner to fork code.
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       contains(github.event.pull_request.labels.*.name, 'full-ci'))
    steps:
      - name: Ensure git-lfs is available
        # Repo now ships LFS-vendored bot fixtures (.gitattributes routes them
        # through the lfs smudge filter). Even jobs that don't use those
        # fixtures must have git-lfs in PATH or `git checkout` aborts on the
        # smudge step. Self-hosted runner has no git-lfs by default and no
        # passwordless sudo; install the standalone binary into ~/.local/bin.
        run: |
          set -euo pipefail
          if command -v git-lfs >/dev/null 2>&1; then
            git-lfs --version
            exit 0
          fi
          GIT_LFS_VERSION="3.5.1"
          tmpdir="$(mktemp -d)"
          curl -fsSL \
            "https://github.com/git-lfs/git-lfs/releases/download/v${GIT_LFS_VERSION}/git-lfs-linux-amd64-v${GIT_LFS_VERSION}.tar.gz" \
            | tar -xz -C "$tmpdir"
          mkdir -p "$HOME/.local/bin"
          install "$tmpdir/git-lfs-${GIT_LFS_VERSION}/git-lfs" "$HOME/.local/bin/git-lfs"
          rm -rf "$tmpdir"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/git-lfs" install --skip-repo
          "$HOME/.local/bin/git-lfs" --version
      - uses: actions/checkout@v4

      - name: Load ExApp image
        id: load
        uses: ./.github/actions/load-exapp-image
        with:
          image-ref-list: ${{ needs.build-image-cuda.outputs.image_ref }}
          pr-source: registry
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run CUDA transcribe smoke
        env:
          IMAGE_REF: ${{ steps.load.outputs.ref }}
        run: ./harness/bin/ci-transcribe-smoke-exapp.sh

      - name: Run dual-variant transcript verify (CUDA = v3 fp32)
        env:
          IMAGE_REF: ${{ steps.load.outputs.ref }}
          # Empirically on this clip fp32 (CUDA) lands at ratio 0.6565 —
          # essentially identical to int8 (CPU at 0.6391). The first ~6s of
          # the LibriSpeech clip is dropped by sherpa-onnx's streaming VAD
          # regardless of model precision; fp32 doesn't recover those words.
          # Smoke floor catches "loaded but gibberish" without gating WER.
          # Tracked: investigate sherpa-onnx VAD softness on Parakeet v3.
          MIN_LEVENSHTEIN: "0.50"
        run: ./harness/bin/ci-e2e-v3-transcript-verify.sh

      - name: Reclaim docker disk (post-job)
        if: always()
        # The self-hosted GPU runner accumulates multi-GB CUDA image layers
        # across PRs; one CI-heavy day filled its disk and killed GPU jobs at
        # image load (D-377). Only one job runs on this runner at a time, and
        # prune -a only removes images/containers nothing references, so this
        # is safe. A host-side hourly cron is the primary guard; this trims
        # right after each heavy job so bursts can't outrun the cron.
        run: |
          docker container prune -f --filter until=2h || true
          docker image prune -af --filter until=6h || true
          docker builder prune -af --filter until=6h || true
          if [ "$(df --output=pcent / | tail -1 | tr -dc 0-9)" -ge 85 ]; then
            docker image prune -af || true
            docker builder prune -af || true
          fi
          df -h / | tail -1

  transcribe-smoke:
    name: Smoke transcription (bundled model, no download)
    runs-on: ubuntu-latest
    needs: build-image
    # Heavy tier: push/dispatch, or a PR labeled `full-ci` (pulls the LFS model
    # and runs transcription quality checks — too slow for every PR push).
    if: >-
      github.event_name != 'pull_request' ||
      contains(github.event.pull_request.labels.*.name, 'full-ci')
    steps:
      - uses: actions/checkout@v4

      - name: Load ExApp image
        id: load
        uses: ./.github/actions/load-exapp-image
        with:
          image-ref-list: ${{ needs.build-image.outputs.image_ref }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run transcribe smoke
        env:
          IMAGE_REF: ${{ steps.load.outputs.ref }}
        run: ./harness/bin/ci-transcribe-smoke-exapp.sh

      - name: Run dual-variant transcript verify (CPU = v3 int8)
        env:
          IMAGE_REF: ${{ steps.load.outputs.ref }}
          # v3 int8 (CPU) drops the soft opening on this clip — sherpa-onnx's
          # streaming VAD does not pick up the early words. The threshold is
          # a smoke floor that catches "model loaded but produced gibberish"
          # without gating on absolute WER. Investigation tracked separately.
          MIN_LEVENSHTEIN: "0.50"
        run: ./harness/bin/ci-e2e-v3-transcript-verify.sh

      - name: Materialize short-clip fixture (selective LFS pull)
        # The short-clip regression below slices a single LFS-vendored bot
        # track (mira.ogg, ~630 KB). A selective pull fetches just that
        # object instead of the ~100 MB the full showcase fixture set would
        # cost with `lfs: true` on the checkout — keeps the LFS bandwidth
        # quota flat. ubuntu-latest ships git-lfs preinstalled.
        run: git lfs pull --include="harness/media/processed/showcase-lantern-festival-v1/mira.ogg"

      - name: Install host ffmpeg for clip slicing
        # The regression script slices the source track on the host with
        # `ffmpeg -c copy` (stream copy, no re-encode — cheap). Same apt
        # install ci.yml's harness jobs use; ubuntu-latest has no ffmpeg.
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Run short-clip ASR regression (decoder pad-tail guard)
        # Guards the Parakeet TDT v3 short-clip zero-token fix
        # (cassini-go-recorder/internal/transcribe/stt.go transcribeSegment
        # pad-tail logic): clean 6-9s clips with no trailing silence must
        # not transcribe to zero words. Its failure signature matches flake
        # #50 — if this step trips while the Talk roundtrip stays green,
        # the regression localizes to the decoder, not the media path.
        env:
          IMAGE_REF: ${{ steps.load.outputs.ref }}
        run: ./harness/bin/ci-transcribe-short-clip-regression.sh

  e2e-container:
    name: E2E container HTTP plane + middleware + lifecycle (no Nextcloud)
    runs-on: ubuntu-latest
    needs: build-image
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Load ExApp image
        id: load
        uses: ./.github/actions/load-exapp-image
        with:
          image-ref-list: ${{ needs.build-image.outputs.image_ref }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run container-level e2e
        env:
          IMAGE_REF: ${{ steps.load.outputs.ref }}
        run: ./harness/bin/ci-e2e-exapp.sh

  e2e-entrypoint:
    name: E2E container real entrypoint + HEALTHCHECK (AppAPI env, no overrides)
    runs-on: ubuntu-latest
    needs: build-image
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Load ExApp image
        id: load
        uses: ./.github/actions/load-exapp-image
        with:
          image-ref-list: ${{ needs.build-image.outputs.image_ref }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Unlike the smoke/e2e jobs above, this boots the image via its real
      # ENTRYPOINT with only AppAPI-shaped env (no --entrypoint override, no
      # CASSINI_* injection, no HP_*) and waits for the image HEALTHCHECK to
      # report healthy — the production boot contract a real install hits.
      - name: Run real-entrypoint e2e
        env:
          IMAGE_REF: ${{ steps.load.outputs.ref }}
        run: ./harness/bin/ci-e2e-entrypoint-exapp.sh

  e2e-install:
    name: E2E manual-install proxy + lifecycle (Nextcloud / AppAPI)
    runs-on: ubuntu-latest
    needs: build-image
    timeout-minutes: 30
    # Heavy tier: push/dispatch, or a PR labeled `full-ci` (spins up a full
    # Nextcloud + AppAPI install — minutes-expensive).
    if: >-
      github.event_name != 'pull_request' ||
      contains(github.event.pull_request.labels.*.name, 'full-ci')
    steps:
      - uses: actions/checkout@v4

      - name: Load ExApp image
        id: load
        uses: ./.github/actions/load-exapp-image
        with:
          image-ref-list: ${{ needs.build-image.outputs.image_ref }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run manual-install e2e against a fresh Nextcloud + AppAPI
        env:
          IMAGE_REF: ${{ steps.load.outputs.ref }}
        run: ./harness/bin/ci-e2e-install-exapp.sh

  # Full Talk-driven roundtrip: bot streamers join a Talk call, Talk's
  # native "record call" button fires, operator HMAC-authenticates,
  # cassini-go-recorder joins the call as a guest, captures RTP for
  # ~75s, then the build pipeline produces a meeting bundle. Phase 8
  # asserts the published transcript contains a verbatim substring of
  # the scenario script. Runs on both image variants so a regression
  # in either the CPU or CUDA build path is caught before publish.
  e2e-talk-record-cpu:
    name: E2E manual-install Talk roundtrip (CPU)
    runs-on: ubuntu-latest
    needs: build-image
    timeout-minutes: 25
    # Heavy tier: push/dispatch, or a PR labeled `full-ci` (full Talk-driven
    # record roundtrip — slow, and flakes near the content-capture floor).
    if: >-
      github.event_name != 'pull_request' ||
      contains(github.event.pull_request.labels.*.name, 'full-ci')
    # Bot fixture set is now vendored via git-lfs (see .gitattributes), so
    # the harness can run on a fresh CI checkout. Treat this job as a hard
    # gate now rather than an informational warning.
    steps:
      - name: Ensure git-lfs is available
        # ubuntu-latest ships git-lfs preinstalled, but self-hosted runners
        # generally don't. Use the standalone binary into ~/.local/bin so the
        # install path doesn't depend on sudo / apt — most self-hosted runners
        # have no passwordless sudo.
        run: |
          set -euo pipefail
          if command -v git-lfs >/dev/null 2>&1; then
            git-lfs --version
            exit 0
          fi
          GIT_LFS_VERSION="3.5.1"
          tmpdir="$(mktemp -d)"
          curl -fsSL \
            "https://github.com/git-lfs/git-lfs/releases/download/v${GIT_LFS_VERSION}/git-lfs-linux-amd64-v${GIT_LFS_VERSION}.tar.gz" \
            | tar -xz -C "$tmpdir"
          mkdir -p "$HOME/.local/bin"
          install "$tmpdir/git-lfs-${GIT_LFS_VERSION}/git-lfs" "$HOME/.local/bin/git-lfs"
          rm -rf "$tmpdir"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/git-lfs" install --skip-repo
          "$HOME/.local/bin/git-lfs" --version
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Force LFS smudge
        # On ubuntu-latest the working tree is fresh, but on self-hosted
        # runners the tree is reused across runs and checkout@v4 may skip
        # smudging files it considers unchanged, leaving stale pointers.
        # `git lfs pull` is idempotent and cheap, so we run it on both
        # jobs to keep them symmetric.
        run: git lfs pull
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: Confirm bot media fixture is materialized
        run: |
          set -euo pipefail
          # The fixture is vendored under harness/media/processed/
          # showcase-lantern-festival-v1/ via git-lfs (see .gitattributes).
          # checkout@v4 with lfs: true above pulls LFS content, so the .ogg
          # and .ivf files should be real content here, not 132-byte pointers.
          # Hard-fail if not: a silent skip would let LFS regressions ship.
          f=harness/media/processed/showcase-lantern-festival-v1/mira.ogg
          if [[ ! -s "$f" ]] || [[ $(stat -c%s "$f") -le 10000 ]]; then
            echo "::error::Talk e2e bot media missing or still an LFS pointer at $f" >&2
            echo "::error::checkout@v4 should have materialized it (lfs: true is set). Check repo LFS quota." >&2
            exit 1
          fi
      - name: Load ExApp image
        id: load
        uses: ./.github/actions/load-exapp-image
        with:
          image-ref-list: ${{ needs.build-image.outputs.image_ref }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Pre-pull compose stack images
        # Pull the Nextcloud + Talk signaling stack images in a dedicated
        # step so registry/network failures show up here (not buried inside
        # the phase-1 harness step) and so the harness step's wall-clock
        # reflects only the e2e logic, not image transfer time. Images live
        # at the daemon level so no project name is required.
        run: docker compose -f harness/compose.yml --profile full pull
      - name: Run manual-install Talk e2e (CPU)
        env:
          IMAGE_REF: ${{ steps.load.outputs.ref }}
          # 75s gives the rotator several cycles per bot, enough that at
          # least one participant track captures a multi-word verbatim
          # slice of the scenario script.
          RECORD_DURATION_SECONDS: "75"
          # Strict Levenshtein on the full 3.7KB scenario is dominated
          # by missing content (most bots' tracks are sparse-RTP DTX
          # silence today — see task #11); accept a verbatim word-run
          # substring as proof the pipeline transcribed real speech.
          MIN_LEVENSHTEIN: "0.40"
          MIN_CAPTURED_RUN_WORDS: "5"
          # Pin LOG_DIR to a stable path so the failure-artifact step below
          # can find the pulled transcript + recorder stdout deterministically
          # (the harness default is a PID-suffixed /tmp dir).
          LOG_DIR: ${{ runner.temp }}/cassini-talk-rec-e2e
        run: ./harness/bin/ci-e2e-talk-record-roundtrip.sh
      - name: Upload transcript + recorder logs on failure
        if: failure()
        # D-50: the CPU merged-fallback transcript gate flakes near the
        # MIN_CAPTURED_RUN_WORDS floor. Capturing the published transcript
        # JSON and the recorder stdout lets a future reviewer tell a genuine
        # "always got 1 word" regression from a sporadic flake without
        # re-running CI. transcript.words.v1.json is pulled in phase 9 (so it
        # exists for the content-gate failure we care about) and cassini-exapp.log
        # is written by the harness cleanup trap on every exit.
        uses: actions/upload-artifact@v4
        with:
          name: e2e-talk-record-cpu-debug
          path: |
            ${{ runner.temp }}/cassini-talk-rec-e2e/transcript.words.v1.json
            ${{ runner.temp }}/cassini-talk-rec-e2e/cassini-exapp.log
          if-no-files-found: warn
          retention-days: 14

  e2e-talk-record-cuda:
    name: E2E manual-install Talk roundtrip (CUDA / GPU)
    runs-on: [self-hosted, Linux, X64, gpu]
    needs: build-image-cuda
    timeout-minutes: 25
    # Heavy tier (self-hosted GPU): push/dispatch, or a same-repo PR labeled
    # `full-ci`. Mirrors the build-image-cuda guard as defense-in-depth.
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       contains(github.event.pull_request.labels.*.name, 'full-ci'))
    steps:
      - name: Ensure git-lfs is available
        # Self-hosted GPU runners don't ship git-lfs by default AND don't
        # generally have passwordless sudo. Install the standalone binary
        # into ~/.local/bin so this step is portable across runner types.
        run: |
          set -euo pipefail
          if command -v git-lfs >/dev/null 2>&1; then
            git-lfs --version
            exit 0
          fi
          GIT_LFS_VERSION="3.5.1"
          tmpdir="$(mktemp -d)"
          curl -fsSL \
            "https://github.com/git-lfs/git-lfs/releases/download/v${GIT_LFS_VERSION}/git-lfs-linux-amd64-v${GIT_LFS_VERSION}.tar.gz" \
            | tar -xz -C "$tmpdir"
          mkdir -p "$HOME/.local/bin"
          install "$tmpdir/git-lfs-${GIT_LFS_VERSION}/git-lfs" "$HOME/.local/bin/git-lfs"
          rm -rf "$tmpdir"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/git-lfs" install --skip-repo
          "$HOME/.local/bin/git-lfs" --version
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Force LFS smudge
        # See sibling CPU job: self-hosted runners reuse the working tree
        # so checkout@v4 may leave stale pointer files; `git lfs pull` is
        # the idempotent recovery.
        run: git lfs pull
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: Confirm bot media fixture is materialized
        run: |
          set -euo pipefail
          # See sibling CPU job — fixture is vendored via git-lfs.
          # Hard-fail if not materialized; a silent skip would let LFS
          # regressions ship.
          f=harness/media/processed/showcase-lantern-festival-v1/mira.ogg
          if [[ ! -s "$f" ]] || [[ $(stat -c%s "$f") -le 10000 ]]; then
            echo "::error::Talk e2e bot media missing or still an LFS pointer at $f" >&2
            echo "::error::checkout@v4 should have materialized it (lfs: true is set). Check repo LFS quota." >&2
            exit 1
          fi
      - name: Load ExApp image
        id: load
        uses: ./.github/actions/load-exapp-image
        with:
          image-ref-list: ${{ needs.build-image-cuda.outputs.image_ref }}
          pr-source: registry
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Pre-pull compose stack images
        # See sibling CPU job — splits image transfer time and registry
        # failures out of the harness step.
        run: docker compose -f harness/compose.yml --profile full pull
      - name: Run manual-install Talk e2e (GPU)
        env:
          IMAGE_REF: ${{ steps.load.outputs.ref }}
          RECORD_DURATION_SECONDS: "75"
          MIN_LEVENSHTEIN: "0.40"
          MIN_CAPTURED_RUN_WORDS: "5"
        run: ./harness/bin/ci-e2e-talk-record-roundtrip.sh

      - name: Reclaim docker disk (post-job)
        if: always()
        # See transcribe-smoke-cuda — same self-hosted GPU runner, same D-377
        # disk-exhaustion guard. The roundtrip script already sweeps its own
        # compose stacks; this trims accumulated image layers on top.
        run: |
          docker container prune -f --filter until=2h || true
          docker image prune -af --filter until=6h || true
          docker builder prune -af --filter until=6h || true
          if [ "$(df --output=pcent / | tail -1 | tr -dc 0-9)" -ge 85 ]; then
            docker image prune -af || true
            docker builder prune -af || true
          fi
          df -h / | tail -1

  prune-old-versions:
    name: Prune old sha-tagged image versions
    runs-on: ubuntu-latest
    needs:
      - build-image
      - build-cuda-base
      - build-image-cuda
      - smoke
      - transcribe-smoke
      - transcribe-smoke-cuda
      - e2e-container
      - e2e-entrypoint
      - e2e-install
      - e2e-talk-record-cpu
      - e2e-talk-record-cuda
    # Only prune after a successful push that actually pushed to ghcr —
    # main (publishes :latest) and version tags.
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
    permissions:
      packages: write
    steps:
      # For container packages, the GitHub API returns sha256 digests in
      # `name` and the actual tags in `metadata.container.tags`. The
      # delete-package-versions action's `ignore-versions` regex matches
      # against `name` (the digest), which is useless here. Use a bash
      # script that inspects tags explicitly: keep every version that
      # carries a named tag (latest*, cuda, release versions X.Y.Z[-suffix],
      # legacy v*); from the remainder (sha-*-only versions), keep the 10
      # newest and delete the rest.
      - name: Prune
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          PACKAGE: gocassini
          KEEP: 10
        run: |
          set -euo pipefail
          tmp=$(mktemp -d)
          trap 'rm -rf "$tmp"' EXIT

          # Fetch every version of the container package.
          gh api --paginate \
            -H "Accept: application/vnd.github+json" \
            "/orgs/${OWNER}/packages/container/${PACKAGE}/versions" \
            > "$tmp/versions.json"

          # Protect manifests referenced BY a kept tag. A multi-arch index is
          # itself tagged, but the per-platform manifests it points at are
          # untagged — so a tag-only keep rule happily deletes the actual
          # image out from under a tag it just decided to keep forever. That
          # is what emptied every -cuda tag. The CUDA build no longer pushes
          # an index, but any future multi-arch push must not re-break this.
          echo "${GH_TOKEN}" | docker login ghcr.io -u "${OWNER}" --password-stdin >/dev/null 2>&1 || true
          : > "$tmp/protected.txt"
          jq -r '
            .[] | .metadata.container.tags[]?
            | select(. == "latest" or . == "latest-cuda" or . == "latest-rocm"
                     or . == "cuda" or startswith("v")
                     or test("^[0-9]+\\.[0-9]+\\.[0-9]+"))
          ' "$tmp/versions.json" | sort -u | while read -r tag; do
            docker buildx imagetools inspect --raw "ghcr.io/${OWNER}/${PACKAGE}:${tag}" 2>/dev/null \
              | jq -r '.manifests[]?.digest' >> "$tmp/protected.txt" || true
          done
          sort -u -o "$tmp/protected.txt" "$tmp/protected.txt"
          echo "Protected $(wc -l < "$tmp/protected.txt") child manifest(s) referenced by kept tags."

          # Versions worth keeping outright (any named tag). Release tags
          # X.Y.Z[-cuda|-rocm] must survive forever — they are the
          # reproducible install pins referenced by appinfo/info.xml.
          jq -r '
            .[]
            | .metadata.container.tags as $tags
            | select(
                ($tags | any(. == "latest" or . == "latest-cuda" or . == "latest-rocm" or . == "cuda" or startswith("v") or test("^[0-9]+\\.[0-9]+\\.[0-9]+")))
              )
            | "KEEP \(.id) tags=\($tags | join(","))"
          ' "$tmp/versions.json" | tee "$tmp/keep.log" || true

          # Candidate versions for pruning: tagged only with sha-* (or untagged).
          # Sort newest -> oldest, skip the first $KEEP, delete the rest.
          jq -r '
            sort_by(.created_at) | reverse
            | .[]
            | .metadata.container.tags as $tags
            | select(
                ($tags | any(. == "latest" or . == "latest-cuda" or . == "latest-rocm" or . == "cuda" or startswith("v") or test("^[0-9]+\\.[0-9]+\\.[0-9]+"))) | not
              )
            | "\(.id)\t\(.name)\t\(.created_at)\t\($tags | join(","))"
          ' "$tmp/versions.json" > "$tmp/candidates.tsv"

          total=$(wc -l < "$tmp/candidates.tsv")
          echo "Found ${total} sha-only / untagged versions; will keep newest ${KEEP}"

          if [[ "${total}" -le "${KEEP}" ]]; then
            echo "Nothing to prune."
            exit 0
          fi

          tail -n +$((KEEP + 1)) "$tmp/candidates.tsv" | while IFS=$'\t' read -r id digest created tags; do
            if grep -qxF "${digest}" "$tmp/protected.txt"; then
              echo "SKIP   id=${id} digest=${digest} — referenced by a kept tag"
              continue
            fi
            echo "DELETE id=${id} digest=${digest} created=${created} tags=${tags}"
            gh api -X DELETE \
              -H "Accept: application/vnd.github+json" \
              "/orgs/${OWNER}/packages/container/${PACKAGE}/versions/${id}"
          done

      # The CUDA base package (D-375) is content-hash-tagged only — no
      # keep-forever named tags. Base rebuilds are rare (only on a model/sherpa/
      # nvidia-base/Dockerfile change), so keeping the newest few covers any
      # in-flight rollback while not letting hashes accumulate forever.
      - name: Prune old CUDA base versions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          PACKAGE: gocassini-cuda-base
          KEEP: 5
        run: |
          set -euo pipefail
          tmp=$(mktemp -d)
          trap 'rm -rf "$tmp"' EXIT

          # The package may not exist yet on the very first base build cycle.
          if ! gh api --paginate \
              -H "Accept: application/vnd.github+json" \
              "/orgs/${OWNER}/packages/container/${PACKAGE}/versions" \
              > "$tmp/versions.json" 2>/dev/null; then
            echo "Package ${PACKAGE} not found yet — nothing to prune."
            exit 0
          fi

          jq -r 'sort_by(.created_at) | reverse | .[] | "\(.id)\t\(.created_at)\t\(.metadata.container.tags | join(","))"' \
            "$tmp/versions.json" > "$tmp/all.tsv"
          total=$(wc -l < "$tmp/all.tsv")
          echo "Found ${total} base versions; keeping newest ${KEEP}"
          if [[ "${total}" -le "${KEEP}" ]]; then
            echo "Nothing to prune."
            exit 0
          fi
          tail -n +$((KEEP + 1)) "$tmp/all.tsv" | while IFS=$'\t' read -r id created tags; do
            echo "DELETE id=${id} created=${created} tags=${tags}"
            gh api -X DELETE \
              -H "Accept: application/vnd.github+json" \
              "/orgs/${OWNER}/packages/container/${PACKAGE}/versions/${id}"
          done

      # A tag that resolves is not the same as a tag you can pull: an index
      # can outlive the manifests it points at. Every -cuda tag was in this
      # state (listed by the API, 404 on the child manifest) through several
      # releases without anything failing. Assert pullability explicitly so
      # the next occurrence breaks the publish run instead of the install.
      - name: Verify keep-forever tags are pullable
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          PACKAGE: gocassini
        run: |
          set -euo pipefail
          echo "${GH_TOKEN}" | docker login ghcr.io -u "${OWNER}" --password-stdin >/dev/null
          failed=0
          for tag in latest latest-cuda latest-rocm cuda; do
            ref="ghcr.io/${OWNER}/${PACKAGE}:${tag}"
            if ! raw=$(docker buildx imagetools inspect --raw "${ref}" 2>/dev/null); then
              echo "FAIL ${tag}: tag does not resolve"; failed=1; continue
            fi
            # For an index, every referenced child must itself resolve.
            tag_ok=1
            for child in $(printf '%s' "${raw}" | jq -r '.manifests[]?.digest'); do
              if ! docker buildx imagetools inspect --raw \
                   "ghcr.io/${OWNER}/${PACKAGE}@${child}" >/dev/null 2>&1; then
                echo "FAIL ${tag}: child ${child} is missing from the registry"
                tag_ok=0
                failed=1
              fi
            done
            if [ "${tag_ok}" -eq 1 ]; then echo "OK   ${tag}"; fi
          done
          exit "${failed}"
