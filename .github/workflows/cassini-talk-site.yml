name: cassini.talk site

# Public source validation only. Hosting, R2 uploads and rollback are managed
# separately in the private deployment repository; this workflow needs no secrets.

on:
  push:
    branches: [main]
    paths:
      - 'cassini-talk-site/**'
      - '.github/workflows/cassini-talk-site.yml'
  pull_request:
    paths:
      - 'cassini-talk-site/**'
      - '.github/workflows/cassini-talk-site.yml'

permissions:
  contents: read

concurrency:
  group: cassini-talk-site-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cassini-talk-site
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: cassini-talk-site/.nvmrc
          cache: npm
          cache-dependency-path: cassini-talk-site/package-lock.json

      - name: Install (fails if manifest/lockfile are missing or out of sync)
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test release metadata
        run: npm test

      - name: Build
        run: npm run build

      - name: Keep the website build for review
        uses: actions/upload-artifact@v4
        with:
          name: cassini-talk-site-dist
          path: cassini-talk-site/dist
          retention-days: 14
          if-no-files-found: error
