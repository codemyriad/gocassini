# App Store release — build, sign, and publish the package.
#
# Counterpart to publish-exapp-image.yml (which builds the Docker image on a tag
# push). The scripts under scripts/ do the real work and are unit-tested
# (scripts/test-release-tooling.sh); this workflow orchestrates them around the
# secrets and the one approval that live in CI.
#
# Two ways in:
#   - push a tag v<version> (the normal path — `prepare-release.sh --push` does
#     this): the release runs automatically and, once approved, publishes to the
#     App Store.
#   - workflow_dispatch on an existing tag: choose whether to publish to the
#     store (publish_appstore).
#
# Flow: validate -> verify-images (waits for the parallel image build) ->
# publish. `publish` is the single `release`-environment job, so the whole
# signed release + store push is gated behind ONE approval; declining it aborts
# the release (the images still build independently).

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Existing release version without leading v (e.g. 0.3.0-alpha.1)'
        required: true
        type: string
      publish_appstore:
        description: 'Publish the signed tarball to apps.nextcloud.com'
        required: true
        type: boolean
        default: false

# Least privilege: contents:write for the GitHub release + asset, packages:read
# to confirm the GHCR image tags exist.
permissions:
  contents: write
  packages: read

# Never run two releases of the same version concurrently.
concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && github.event.inputs.version || github.ref_name }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE: ${{ github.repository_owner }}/gocassini

jobs:
  validate:
    name: Validate tag + manifest
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
      publish: ${{ steps.v.outputs.publish }}
      companion: ${{ steps.companion.outputs.present }}
    steps:
      - name: Checkout the release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', github.event.inputs.version) || github.ref }}
          fetch-depth: 0

      - name: Resolve version, tag, and publish flag
        id: v
        env:
          EVENT: ${{ github.event_name }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
          INPUT_PUBLISH: ${{ github.event.inputs.publish_appstore }}
        run: |
          set -euo pipefail
          if [[ "$EVENT" == "workflow_dispatch" ]]; then
            version="$INPUT_VERSION"
            publish="$INPUT_PUBLISH"
          else
            # Tag push: a tagged release is intended for the store, gated by the
            # publish job's approval.
            version="${GITHUB_REF#refs/tags/v}"
            publish="true"
          fi
          {
            echo "version=$version"
            echo "tag=v$version"
            echo "publish=$publish"
          } >> "$GITHUB_OUTPUT"

      - name: Install xmllint
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libxml2-utils

      # Manual dispatch remains useful for repairing historical releases cut
      # before cassini_capture existed. New tags always contain it; old tags
      # keep publishing only the ExApp package they actually shipped.
      - name: Detect native capture companion
        id: companion
        run: |
          if [[ -f cassini_capture/appinfo/info.xml ]]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Manifest, tag and changelog agree with the version
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          set -euo pipefail
          xmllint --noout appinfo/info.xml
          MANIFEST="$(xmllint --xpath 'string(/info/version)' appinfo/info.xml)"
          IMAGE_TAG="$(xmllint --xpath 'string(/info/external-app/docker-install/image-tag)' appinfo/info.xml)"
          if [[ "$MANIFEST" != "$VERSION" ]]; then
            echo "::error::appinfo/info.xml <version> ($MANIFEST) != version ($VERSION)"; exit 1
          fi
          if [[ "$IMAGE_TAG" != "$VERSION" ]]; then
            echo "::error::appinfo/info.xml <image-tag> ($IMAGE_TAG) != version ($VERSION)"; exit 1
          fi
          if [[ -f cassini_capture/appinfo/info.xml ]]; then
            xmllint --noout cassini_capture/appinfo/info.xml
            COMPANION="$(xmllint --xpath 'string(/info/version)' cassini_capture/appinfo/info.xml)"
            if [[ "$COMPANION" != "$VERSION" ]]; then
              echo "::error::cassini_capture/appinfo/info.xml <version> ($COMPANION) != version ($VERSION)"; exit 1
            fi
          fi
          if ! git describe --exact-match --tags HEAD | grep -qx "v${VERSION}"; then
            echo "::error::HEAD is not exactly tag v${VERSION}"; exit 1
          fi
          # Release notes must exist for this version (also used by the publish job).
          ./scripts/extract-release-notes.sh --version "$VERSION" >/dev/null

  verify-images:
    name: Wait for GHCR image tags
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Wait for the release images (built in parallel on the tag push)
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          ref="${REGISTRY}/${IMAGE}"
          for tag in "${VERSION}" "${VERSION}-cuda"; do
            echo "Waiting for ${ref}:${tag} ..."
            found=0
            for _ in $(seq 1 120); do   # up to ~60 min while publish-exapp-image builds
              if docker manifest inspect "${ref}:${tag}" >/dev/null 2>&1; then found=1; break; fi
              sleep 30
            done
            [[ "$found" -eq 1 ]] || { echo "::error::timed out waiting for ${ref}:${tag}"; exit 1; }
            echo "found ${ref}:${tag}"
          done
          docker manifest inspect "${ref}:${VERSION}-rocm" >/dev/null 2>&1 \
            || echo "::warning::optional ${ref}:${VERSION}-rocm not found"

  publish:
    name: Sign, release, and publish
    runs-on: ubuntu-latest
    needs: [validate, verify-images]
    # The single gated job: signing keys and the App Store token live in the
    # protected `release` environment, so the whole signed release + store push
    # pauses for ONE approval here.
    environment: release
    env:
      VERSION: ${{ needs.validate.outputs.version }}
      TAG: ${{ needs.validate.outputs.tag }}
      PUBLISH: ${{ needs.validate.outputs.publish }}
    steps:
      - name: Checkout the release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.tag }}

      - name: Install store-schema validators
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends xsltproc libxml2-utils

      - name: Setup Node for the capture companion
        if: ${{ needs.validate.outputs.companion == 'true' }}
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: '**/package-lock.json'

      - name: Build the native capture companion
        if: ${{ needs.validate.outputs.companion == 'true' }}
        run: |
          set -euo pipefail
          npm ci
          ./scripts/build-capture-companion.sh
          ( cd build/artifacts/capture-companion && sha256sum cassini_capture.tar.gz > cassini_capture.tar.gz.sha256 )

      - name: Build, sign, and validate the tarball
        env:
          APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
          APP_PUBLIC_CRT: ${{ secrets.APP_PUBLIC_CRT }}
        run: |
          set -euo pipefail
          # scripts/occ-nextcloud.sh provides occ via a throwaway nextcloud:stable
          # container; the stage -> sign -> archive -> validate --signed path is
          # verified end-to-end (see docs/release.md).
          OCC="./scripts/occ-nextcloud.sh" \
            ./scripts/build-appstore-tarball.sh --version "$VERSION" --sign-app
          ./scripts/validate-appstore-tarball.sh \
            --version "$VERSION" \
            --tarball build/artifacts/appstore/gocassini.tar.gz --signed
          ( cd build/artifacts/appstore && sha256sum gocassini.tar.gz > gocassini.tar.gz.sha256 )

      - name: Create or update the GitHub release and attach the asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMPANION_PRESENT: ${{ needs.validate.outputs.companion }}
        run: |
          set -euo pipefail
          ./scripts/extract-release-notes.sh --version "$VERSION" > notes.md
          # Published (not draft) when we will push to the store, so the store
          # can fetch the asset from the public release URL; draft otherwise.
          if [[ "$PUBLISH" == "true" ]]; then draft="false"; else draft="true"; fi
          args=(--notes-file notes.md --draft="$draft")
          [[ "$VERSION" == *-* ]] && args+=(--prerelease)
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" "${args[@]}"
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TAG" "${args[@]}"
          fi
          assets=(
            build/artifacts/appstore/gocassini.tar.gz
            build/artifacts/appstore/gocassini.tar.gz.sha256
          )
          if [[ "$COMPANION_PRESENT" == "true" ]]; then
            assets+=(
              build/artifacts/capture-companion/cassini_capture.tar.gz
              build/artifacts/capture-companion/cassini_capture.tar.gz.sha256
            )
          fi
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber "${assets[@]}"

      - name: Publish to apps.nextcloud.com
        if: ${{ needs.validate.outputs.publish == 'true' }}
        env:
          APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
          APPSTORE_TOKEN: ${{ secrets.APPSTORE_TOKEN }}
        run: |
          set -euo pipefail
          download_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/gocassini.tar.gz"
          KEYDIR="$(mktemp -d)"
          trap 'rm -rf "$KEYDIR"' EXIT
          printf '%s' "$APP_PRIVATE_KEY" > "$KEYDIR/gocassini.key"
          signature="$(openssl dgst -sha512 -sign "$KEYDIR/gocassini.key" \
            build/artifacts/appstore/gocassini.tar.gz | openssl base64 -A)"
          # nightly hardcoded false: semver suffixes already mark alpha/beta/rc
          # as App Store pre-releases.
          http_code="$(curl -sS -o response.json -w '%{http_code}' \
            -X POST https://apps.nextcloud.com/api/v1/apps/releases \
            -H "Authorization: Token ${APPSTORE_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "{\"download\": \"${download_url}\", \"signature\": \"${signature}\", \"nightly\": false}")"
          echo "App Store responded ${http_code}"
          cat response.json || true
          case "$http_code" in
            200|201) echo "Published ${TAG} to the App Store." ;;
            *) echo "::error::App Store upload failed (${http_code})"; exit 1 ;;
          esac
