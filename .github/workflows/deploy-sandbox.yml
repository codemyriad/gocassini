name: Deploy Sandbox

# Installs/updates Cassini on the AIO sandbox host by running
# sandbox/wire-cassini.sh over SSH. It does NOT provision Nextcloud AIO itself —
# that is one-time host setup (see sandbox/README.md). Optionally builds and
# pushes an image first when a tag is given (installs from the App Store otherwise).

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Container tag to build and deploy. Leave empty to install the latest release from the App Store (default).
        type: string
        default: ''
      register_only:
        description: Only re-register Cassini; skip HaRP/daemon setup
        type: boolean
        default: false
      source_capture:
        description: Enable participant source-audio capture and install the cassini_capture companion (needs image_tag; default off)
        type: boolean
        default: false
      source_audio_ingest:
        description: Let uploaded captures reach transcripts (experimental; default off)
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-sandbox
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE: ${{ github.repository_owner }}/gocassini

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: Sandbox
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        if: ${{ inputs.image_tag != '' }}
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        if: ${{ inputs.image_tag != '' }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image ref
        id: image
        if: ${{ inputs.image_tag != '' }}
        run: |
          set -euo pipefail
          raw_tag="${{ inputs.image_tag }}"
          safe_tag="$(printf '%s' "$raw_tag" | tr '/' '-' | tr -c 'A-Za-z0-9._-' '-')"
          image_ref="${{ env.REGISTRY }}/${{ env.IMAGE }}:${safe_tag}"
          echo "ref=$image_ref" >> "$GITHUB_OUTPUT"

      - name: Resolve newest stable FFmpeg
        id: ffmpeg
        if: ${{ inputs.image_tag != '' }}
        run: |
          set -euo pipefail
          version=$(deployment/ffmpeg/resolve-latest.sh)
          echo "Resolved FFmpeg ${version}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Build and push ExApp image
        if: ${{ inputs.image_tag != '' }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deployment/Dockerfile.exapp
          platforms: linux/amd64
          push: true
          tags: ${{ steps.image.outputs.ref }}
          build-args: |
            FFMPEG_VERSION=${{ steps.ffmpeg.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install SSH key
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' '${{ secrets.SANDBOX_SSH_KEY }}' > ~/.ssh/sandbox_key
          chmod 600 ~/.ssh/sandbox_key
          ssh-keyscan -p "${{ secrets.SANDBOX_SSH_PORT || vars.SANDBOX_SSH_PORT || '22' }}" "${{ secrets.SANDBOX_SSH_HOST || vars.SANDBOX_SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: Wire Cassini on the AIO host
        env:
          SANDBOX_HOST: ${{ secrets.SANDBOX_SSH_HOST || vars.SANDBOX_SSH_HOST }}
          SANDBOX_SSH_USER: ${{ secrets.SANDBOX_SSH_USER || vars.SANDBOX_SSH_USER }}
          SANDBOX_PORT: ${{ secrets.SANDBOX_SSH_PORT || vars.SANDBOX_SSH_PORT || '22' }}
          SANDBOX_REPO_DIR: ${{ secrets.SANDBOX_REPO_DIR || vars.SANDBOX_REPO_DIR || '~/gocassini' }}
          SANDBOX_NC_ADMIN_PASSWORD: ${{ secrets.SANDBOX_NC_ADMIN_PASSWORD }}
          IMAGE_REF: ${{ steps.image.outputs.ref }}
          REGISTER_ONLY: ${{ inputs.register_only }}
          SOURCE_CAPTURE: ${{ inputs.source_capture }}
          SOURCE_AUDIO_INGEST: ${{ inputs.source_audio_ingest }}
        run: |
          set -euo pipefail
          args=()
          # Empty IMAGE_REF => install the latest App Store release (script default).
          if [ -n "$IMAGE_REF" ]; then
            args+=(--image "$IMAGE_REF")
          fi
          if [ "$REGISTER_ONLY" = "true" ]; then
            args+=(--register-only)
          fi
          # Source capture is a per-deploy decision and the switches are passed
          # explicitly either way, so a deploy without them also turns them OFF
          # on an instance where a previous deploy turned them on.
          if [ "$SOURCE_CAPTURE" = "true" ]; then
            [ -n "$IMAGE_REF" ] || { echo "source_capture needs image_tag: the companion is built from this checkout" >&2; exit 1; }
            args+=(--with-capture)
          fi
          if [ "$SOURCE_AUDIO_INGEST" = "true" ]; then
            args+=(--with-ingest)
          fi

          # The admin password is read from stdin into the remote env so it never
          # appears in the remote process argument list.
          remote_cmd="cd $SANDBOX_REPO_DIR \
            && git fetch origin $GITHUB_REF_NAME \
            && git checkout $GITHUB_SHA \
            && export SANDBOX_NC_ADMIN_PASSWORD=\"\$(cat)\" \
            && sandbox/wire-cassini.sh ${args[*]}"
          printf '%s' "$SANDBOX_NC_ADMIN_PASSWORD" \
            | ssh -i ~/.ssh/sandbox_key -p "$SANDBOX_PORT" "$SANDBOX_SSH_USER@$SANDBOX_HOST" "$remote_cmd"
