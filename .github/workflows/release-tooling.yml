# Release-tooling gate — keeps the scripts/ release toolchain green.
#
# Runs with no secrets: shellchecks the release scripts, actionlints every
# workflow in the repo, and runs the local test suite
# (scripts/test-release-tooling.sh, which builds throwaway fixtures — no Docker,
# network, or credentials).
name: Release tooling

on:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'changelog.d/**'
      # Any workflow change: actionlint now gates the whole repo.
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'scripts/**'
      - 'changelog.d/**'
      - '.github/workflows/**'

permissions:
  contents: read

concurrency:
  group: release-tooling-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint-and-test:
    name: shellcheck + actionlint + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: shellcheck the release scripts
        run: |
          set -euo pipefail
          sudo apt-get update && sudo apt-get install -y --no-install-recommends shellcheck
          shellcheck scripts/*.sh

      # Lints every workflow in the repo (no file args). shellcheck (installed
      # above, also preinstalled on the runner) is picked up automatically to
      # lint the run: blocks.
      - name: actionlint the workflows
        run: |
          set -euo pipefail
          curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash -o /tmp/dl-actionlint.bash
          bash /tmp/dl-actionlint.bash >/dev/null
          ./actionlint

      - name: Run the release-tooling test suite
        run: ./scripts/test-release-tooling.sh
