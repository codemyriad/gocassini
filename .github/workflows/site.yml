name: Site

# Build + lint gate for the Astro site.
#
# Deliberately a separate workflow rather than a job in ci.yml: ci.yml's
# `paths-ignore: '**/*.md'` would skip PRs that only touch the site's
# markdown content, but that content is schema-validated at build time
# (src/content/config.ts), so a bad frontmatter change breaks the build.
#
# `npm ci` here is what guards the failure this workflow was added for: the
# site once shipped with no package.json/lockfile at all, and nothing in
# CI noticed — it was only caught when someone tried to deploy it.

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/site.yml'
  pull_request:
    paths:
      - 'site/**'
      - '.github/workflows/site.yml'

permissions:
  contents: read

concurrency:
  group: site-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # Single source of truth for the build Node version, shared with
          # the Cloudflare build.
          node-version-file: site/.nvmrc
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install (fails if manifest/lockfile are missing or out of sync)
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
