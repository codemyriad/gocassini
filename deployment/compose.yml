services:
  cassini-operator:
    build:
      context: ..
      dockerfile: deployment/Dockerfile.operator
    restart: unless-stopped
    environment:
      CASSINI_OPERATOR_BASE_PATH: ${CASSINI_OPERATOR_BASE_PATH:-/}
      CASSINI_MAX_RECORD_WORKERS: ${CASSINI_MAX_RECORD_WORKERS:-1}
      CASSINI_MAX_BUILD_WORKERS: ${CASSINI_MAX_BUILD_WORKERS:-1}
      # Set to "cuda" on hosts with a GPU runner (e.g. george). Empty leaves
      # the recorder's default in place (--device auto, which resolves to cpu).
      CASSINI_BUILD_DEVICE: ${CASSINI_BUILD_DEVICE:-}
      CASSINI_STT_ADDITIONAL_MODELS: ${CASSINI_STT_ADDITIONAL_MODELS:-}
      CASSINI_OPERATOR_SITE_ROOT: /srv/cassini-site/published
      CASSINI_TALK_RECORDING_SECRET: ${CASSINI_TALK_RECORDING_SECRET:-}
      CASSINI_TALK_BACKEND_URL: ${CASSINI_TALK_BACKEND_URL:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_MODEL: ${LLM_MODEL:-}
      SUMMARY_MODEL: ${SUMMARY_MODEL:-}
      CASSINI_SUMMARY_DISABLED: ${CASSINI_SUMMARY_DISABLED:-}
      CASSINI_READABLE_STRICT_BATCHES: ${CASSINI_READABLE_STRICT_BATCHES:-}
    ports:
      - "${CASSINI_OPERATOR_PORT:-4000}:4000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ${CASSINI_OPERATOR_STATE_STORAGE:-cassini_operator_state}:/var/lib/cassini-operator
      - ${CASSINI_PUBLISHED_SITE_STORAGE:-cassini_published_site}:/srv/cassini-site

  cassini-control-panel:
    build:
      context: ..
      dockerfile: deployment/Dockerfile.control-panel
    restart: unless-stopped
    depends_on:
      - cassini-operator
    environment:
      CASSINI_OPERATOR_BASE_PATH: ${CASSINI_OPERATOR_BASE_PATH:-/}
      CASSINI_OPERATOR_URL: http://host.docker.internal:${CASSINI_OPERATOR_PORT:-4000}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${CASSINI_CONTROL_PANEL_PORT:-4173}:4173"

  cassini-viewer:
    build:
      context: ..
      dockerfile: deployment/Dockerfile.viewer
    restart: unless-stopped
    depends_on:
      - cassini-operator
    ports:
      - "${CASSINI_VIEWER_PORT:-8765}:8765"
    volumes:
      - ${CASSINI_PUBLISHED_SITE_STORAGE:-cassini_published_site}:/srv/cassini-site:ro

volumes:
  cassini_operator_state:
  cassini_published_site:
