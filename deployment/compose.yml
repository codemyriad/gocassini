services:
  cassini-operator:
    build:
      context: ..
      dockerfile: deployment/Dockerfile.operator
      args:
        # deployment/README.md resolves this before every build so a newly
        # published stable FFmpeg release invalidates the cached bundle layer.
        FFMPEG_VERSION: ${FFMPEG_VERSION:-latest}
    restart: unless-stopped
    # Reap zombie ffmpeg/recorder grandchildren (the operator is otherwise
    # PID 1) and give in-flight recordings time to finalize on stop: the
    # operator waits up to recordShutdownWait (31m) before exiting (D-350).
    init: true
    stop_grace_period: 32m
    environment:
      CASSINI_OPERATOR_BASE_PATH: ${CASSINI_OPERATOR_BASE_PATH:-/}
      CASSINI_MAX_RECORD_WORKERS: ${CASSINI_MAX_RECORD_WORKERS:-1}
      CASSINI_MAX_BUILD_WORKERS: ${CASSINI_MAX_BUILD_WORKERS:-1}
      CASSINI_OPERATOR_SITE_ROOT: /srv/cassini-site/published
      CASSINI_TALK_RECORDING_SECRET: ${CASSINI_TALK_RECORDING_SECRET:-}
      CASSINI_TALK_SIGNALING_INTERNAL_SECRET: ${CASSINI_TALK_SIGNALING_INTERNAL_SECRET:-}
      CASSINI_TALK_BACKEND_URL: ${CASSINI_TALK_BACKEND_URL:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_MODEL: ${LLM_MODEL:-}
      SUMMARY_MODEL: ${SUMMARY_MODEL:-}
      CASSINI_SUMMARY_DISABLED: ${CASSINI_SUMMARY_DISABLED:-}
      CASSINI_STT_BACKEND: ${CASSINI_STT_BACKEND:-}
      CASSINI_ATTRIBUTION_DISABLED: ${CASSINI_ATTRIBUTION_DISABLED:-}
      CASSINI_ATTRIBUTION_DROP: ${CASSINI_ATTRIBUTION_DROP:-}
    # The operator job API is unauthenticated, so published ports bind to
    # loopback by default. Docker port publishing bypasses host firewalls
    # (ufw/firewalld); only widen CASSINI_PUBLISH_ADDRESS deliberately.
    ports:
      - "${CASSINI_PUBLISH_ADDRESS:-127.0.0.1}:${CASSINI_OPERATOR_PORT:-4000}:4000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ${CASSINI_OPERATOR_STATE_STORAGE:-cassini_operator_state}:/var/lib/cassini-operator
      - ${CASSINI_PUBLISHED_SITE_STORAGE:-cassini_published_site}:/srv/cassini-site

  # The standalone control-panel preview service was removed in D-420: the
  # operator UI is now a surface inside the unified Cassini app (served by the
  # ExApp at /viewer), not a separate SPA. Its old Dockerfile.control-panel is
  # gone too.

  cassini-viewer:
    build:
      context: ..
      dockerfile: deployment/Dockerfile.viewer
    restart: unless-stopped
    depends_on:
      - cassini-operator
    ports:
      - "${CASSINI_PUBLISH_ADDRESS:-127.0.0.1}:${CASSINI_VIEWER_PORT:-8765}:8765"
    volumes:
      - ${CASSINI_PUBLISHED_SITE_STORAGE:-cassini_published_site}:/srv/cassini-site:ro

volumes:
  cassini_operator_state:
  cassini_published_site:
